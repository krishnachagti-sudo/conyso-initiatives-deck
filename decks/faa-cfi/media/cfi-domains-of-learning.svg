<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="220" fill="#ffffff"/>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">The three domains of learning</text>
<g font-size="18" text-anchor="middle">
<rect x="20" y="60" width="190" height="130" rx="10" fill="#dbe8f7" stroke="#2b5c8a" stroke-width="2"/>
<text x="115" y="118" font-weight="bold" fill="#1a1a1a">Cognitive</text>
<text x="115" y="146" fill="#1a1a1a">thinking</text>
<rect x="225" y="60" width="190" height="130" rx="10" fill="#f7e3d6" stroke="#9a4a1c" stroke-width="2"/>
<text x="320" y="118" font-weight="bold" fill="#1a1a1a">Affective</text>
<text x="320" y="146" fill="#1a1a1a">feeling</text>
<rect x="430" y="60" width="190" height="130" rx="10" fill="#dcefdc" stroke="#2e6b2e" stroke-width="2"/>
<text x="525" y="118" font-weight="bold" fill="#1a1a1a">Psychomotor</text>
<text x="525" y="146" fill="#1a1a1a">doing</text>
</g>
</svg>
