<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Demonstration-performance method (handbook ch. 9: four phases)</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <g font-size="14" fill="#1a1a1a" text-anchor="middle">
    <rect x="20" y="60" width="150" height="70" rx="8" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="2"/>
    <text x="95" y="90">1. Explanation</text>
    <rect x="210" y="60" width="150" height="70" rx="8" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="2"/>
    <text x="285" y="90">2. Demonstration</text>
    <rect x="400" y="60" width="170" height="70" rx="8" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="2"/>
    <text x="485" y="85">3. Learner performance</text>
    <text x="485" y="105">with instructor</text>
    <text x="485" y="122">supervision</text>
    <rect x="610" y="60" width="130" height="70" rx="8" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="2"/>
    <text x="675" y="90">4. Evaluation</text>
  </g>
  <g stroke="#444" stroke-width="2" marker-end="url(#a)">
    <line x1="172" y1="95" x2="206" y2="95"/>
    <line x1="362" y1="95" x2="396" y2="95"/>
    <line x1="572" y1="95" x2="606" y2="95"/>
  </g>
  <line x1="485" y1="132" x2="485" y2="158" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="485" y="178" text-anchor="middle" font-size="13" fill="#333">Chapter 5 counts these as two phases,</text>
  <text x="485" y="196" text-anchor="middle" font-size="13" fill="#333">learner performance and instructor supervision,</text>
  <text x="485" y="214" text-anchor="middle" font-size="13" fill="#333">giving five phases in all.</text>
</svg>
