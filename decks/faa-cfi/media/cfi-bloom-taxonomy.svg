<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="360" fill="#ffffff"/>
<text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Bloom's taxonomy of the cognitive domain</text>
<g font-size="17" text-anchor="middle" fill="#1a1a1a">
<rect x="160" y="50" width="200" height="42" fill="#c9dcf2" stroke="#2b5c8a"/><text x="260" y="77">6 Evaluation</text>
<rect x="130" y="96" width="260" height="42" fill="#c9dcf2" stroke="#2b5c8a"/><text x="260" y="123">5 Synthesis</text>
<rect x="100" y="142" width="320" height="42" fill="#c9dcf2" stroke="#2b5c8a"/><text x="260" y="169">4 Analysis</text>
<rect x="70" y="188" width="380" height="42" fill="#eef3f9" stroke="#2b5c8a"/><text x="260" y="215">3 Application</text>
<rect x="40" y="234" width="440" height="42" fill="#eef3f9" stroke="#2b5c8a"/><text x="260" y="261">2 Comprehension</text>
<rect x="10" y="280" width="500" height="42" fill="#eef3f9" stroke="#2b5c8a"/><text x="260" y="307">1 Knowledge</text>
</g>
<path d="M 525 52 L 540 52 L 540 182 L 525 182" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="548" y="112" font-size="15" font-weight="bold" fill="#1a1a1a">Higher order</text>
<text x="548" y="130" font-size="15" font-weight="bold" fill="#1a1a1a">thinking</text>
<text x="548" y="148" font-size="15" font-weight="bold" fill="#1a1a1a">skills</text>
<text x="520" y="346" font-size="14" text-anchor="end" fill="#444444">simplest at the bottom, most complex at the top</text>
</svg>
