<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="300" fill="#ffffff"/>
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Positive exchange of flight controls</text>
<g font-size="17" fill="#1a1a1a">
<rect x="20" y="55" width="600" height="65" rx="10" fill="#dbe8f7" stroke="#2b5c8a" stroke-width="2"/>
<text x="40" y="82" font-weight="bold">1. Pilot handing over:</text><text x="40" y="106">“You have the flight controls.”</text>
<rect x="20" y="135" width="600" height="65" rx="10" fill="#f7e3d6" stroke="#9a4a1c" stroke-width="2"/>
<text x="40" y="162" font-weight="bold">2. Pilot taking over, immediately:</text><text x="40" y="186">“I have the flight controls.”</text>
<rect x="20" y="215" width="600" height="65" rx="10" fill="#dcefdc" stroke="#2e6b2e" stroke-width="2"/>
<text x="40" y="242" font-weight="bold">3. Pilot handing over, again:</text><text x="40" y="266">“You have the flight controls.” Then a visual check.</text>
</g>
</svg>
