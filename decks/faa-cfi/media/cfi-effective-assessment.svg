<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="260" fill="#ffffff"/>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Characteristics of effective assessment</text>
