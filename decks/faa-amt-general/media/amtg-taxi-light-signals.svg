<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" font-family="Helvetica, Arial, sans-serif">
<title>Standard taxi light signals</title>
<rect width="520" height="300" fill="#ffffff"/>
<text x="20" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">Standard taxi light signals (tower to aircraft)</text>
<line x1="20" y1="46" x2="500" y2="46" stroke="#888"/>
<text x="20" y="66" font-size="13" font-weight="bold" fill="#444">Light</text>
<text x="250" y="66" font-size="13" font-weight="bold" fill="#444">Meaning</text>
<g font-size="15" fill="#1a1a1a">
<circle cx="32" cy="94" r="9" fill="#1f9d3a" stroke="#1f9d3a" stroke-dasharray="3 3" stroke-width="3" fill-opacity="0.85"/>
<text x="52" y="99">Flashing green</text><text x="250" y="99">Cleared to taxi</text>
<circle cx="32" cy="136" r="9" fill="#d32020"/>
<text x="52" y="141">Steady red</text><text x="250" y="141">Stop</text>
<circle cx="32" cy="178" r="9" fill="#d32020" stroke="#d32020" stroke-dasharray="3 3" stroke-width="3" fill-opacity="0.85"/>
<text x="52" y="183">Flashing red</text><text x="250" y="183">Taxi clear of runway in use</text>
<circle cx="32" cy="220" r="9" fill="#ffffff" stroke="#555" stroke-dasharray="3 3" stroke-width="2"/>
<text x="52" y="225">Flashing white</text><text x="250" y="225">Return to starting point</text>
<path d="M32 253 a9 9 0 0 1 0 18 z" fill="#1f9d3a"/><path d="M32 253 a9 9 0 0 0 0 18 z" fill="#d32020"/>
<text x="52" y="267">Alternating red and green</text><text x="250" y="267">Exercise extreme caution</text>
</g>
<text x="20" y="292" font-size="10" fill="#666">Dashed ring = flashing. Drawn from FAA-H-8083-30B, Figure 1-22.</text>
</svg>
