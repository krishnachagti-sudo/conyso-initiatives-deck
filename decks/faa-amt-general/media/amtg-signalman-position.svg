<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" font-family="Helvetica, Arial, sans-serif">
<title>Taxi signalman standard position</title>
<rect width="480" height="340" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1a1a1a">Taxi signalman: standard position (plan view)</text>
<g fill="#c9d3de" stroke="#56687a" stroke-width="2">
<path d="M270 70 q14 0 14 30 v170 h-28 v-170 q0 -30 14 -30 z"/>
<path d="M140 150 h260 v26 h-260 z"/>
<path d="M226 250 h88 v16 h-88 z"/>
</g>
<text x="270" y="62" font-size="13" text-anchor="middle" fill="#1a1a1a">Nose</text>
<text x="118" y="168" font-size="12" text-anchor="end" fill="#1a1a1a">Left</text>
<text x="118" y="182" font-size="12" text-anchor="end" fill="#1a1a1a">wingtip</text>
<circle cx="140" cy="108" r="11" fill="#e0701a"/>
<line x1="140" y1="120" x2="140" y2="146" stroke="#e0701a" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M134 140 l6 8 l6 -8" fill="none" stroke="#e0701a" stroke-width="2"/>
<text x="160" y="96" font-size="13" fill="#1a1a1a">Signalman: slightly ahead of and</text>
<text x="160" y="112" font-size="13" fill="#1a1a1a">in line with the left wingtip,</text>
<text x="160" y="128" font-size="13" fill="#1a1a1a">facing the aircraft (nose on the left)</text>
<text x="20" y="325" font-size="10" fill="#666">Drawn from FAA-H-8083-30B, ch. 1 “Taxi Signals”.</text>
</svg>
