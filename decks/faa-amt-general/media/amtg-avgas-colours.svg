<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Helvetica, Arial, sans-serif">
<title>AVGAS grade colours</title>
<rect width="480" height="270" fill="#ffffff"/>
<text x="20" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">Aviation gasoline: colour and grade</text>
<g font-size="16" fill="#1a1a1a">
<rect x="20" y="52" width="60" height="30" rx="4" fill="#d32020"/><text x="96" y="73">Red</text><text x="220" y="73">Grade 80</text>
<rect x="20" y="92" width="60" height="30" rx="4" fill="#1f9d3a"/><text x="96" y="113">Green</text><text x="220" y="113">Grade 100</text>
<rect x="20" y="132" width="60" height="30" rx="4" fill="#1f5fd3"/><text x="96" y="153">Blue</text><text x="220" y="153">Grade 100LL</text>
<rect x="20" y="172" width="60" height="30" rx="4" fill="#7a2fb5"/><text x="96" y="193">Purple</text><text x="220" y="193">Grade 115</text>
<rect x="20" y="212" width="60" height="30" rx="4" fill="#111111"/><text x="96" y="233">Black band</text><text x="220" y="233">Jet fuel (on piping and equipment)</text>
</g>
<text x="20" y="262" font-size="10" fill="#666">Drawn from FAA-H-8083-30B, Figure 1-31 and ch. 1 “Types of Fuel and Identification”.</text>
</svg>
