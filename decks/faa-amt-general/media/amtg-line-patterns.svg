<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Helvetica, Arial, sans-serif" font-size="18">
  <rect width="480" height="300" fill="#ffffff"/>
  <g fill="#000000">
    <text x="20" y="46">1</text>
    <text x="20" y="101">2</text>
    <text x="20" y="156">3</text>
    <text x="20" y="211">4</text>
    <text x="20" y="266">5</text>
  </g>
  <g stroke="#000000" fill="none">
    <!-- 1: alternate long and short dashes (centreline) -->
    <line x1="60" y1="40" x2="450" y2="40" stroke-width="1.5" stroke-dasharray="40 8 8 8"/>
    <!-- 2: short dashes evenly spaced (hidden line) -->
    <line x1="60" y1="95" x2="450" y2="95" stroke-width="2.5" stroke-dasharray="14 8"/>
    <!-- 3: one long and two short evenly spaced dashes (phantom line) -->
    <line x1="60" y1="150" x2="450" y2="150" stroke-width="1.5" stroke-dasharray="40 8 8 8 8 8"/>
    <!-- 4: very short dashes, about half the length of line 2's (stitch line) -->
    <line x1="60" y1="205" x2="450" y2="205" stroke-width="2.5" stroke-dasharray="7 8"/>
    <!-- 5: continuous medium-to-wide line (outline or visible line) -->
    <line x1="60" y1="260" x2="450" y2="260" stroke-width="4"/>
  </g>
</svg>
