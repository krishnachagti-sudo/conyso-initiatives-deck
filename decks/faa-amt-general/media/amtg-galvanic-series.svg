<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 598" width="720" height="598" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="598" fill="#ffffff"/>
<text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">The galvanic series of metals and alloys</text>
<text x="360" y="52" text-anchor="middle" font-size="13" fill="#b42318">Top of left column: anodic, most likely to corrode</text>
<text x="360" y="580" text-anchor="middle" font-size="13" fill="#1d4ed8">End of right column: cathodic, least likely to corrode</text>
<text x="40" y="88" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">1.</tspan> Magnesium</text>
<text x="40" y="114" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">2.</tspan> Magnesium alloy</text>
<text x="40" y="140" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">3.</tspan> Zinc</text>
<text x="40" y="166" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">4.</tspan> Aluminium (1100)</text>
<text x="40" y="192" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">5.</tspan> Cadmium</text>
<text x="40" y="218" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">6.</tspan> Aluminium 2024-T4</text>
<text x="40" y="244" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">7.</tspan> Steel or iron</text>
