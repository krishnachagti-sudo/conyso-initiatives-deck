<text x="390" y="166" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">22.</tspan> Copper-nickel alloy</text>
<text x="390" y="192" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">23.</tspan> Monel nickel-copper alloy</text>
<text x="390" y="218" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">24.</tspan> Silver solder</text>
