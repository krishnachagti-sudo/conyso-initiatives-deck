<text x="40" y="296" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">9.</tspan> Chromium-iron (active)</text>
<text x="40" y="322" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">10.</tspan> Ni-Resist cast iron</text>
<text x="40" y="348" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">11.</tspan> Type 304 stainless steel (active)</text>
<text x="40" y="374" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">12.</tspan> Type 316 stainless steel (active)</text>
<text x="40" y="400" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">13.</tspan> Lead-tin solder</text>
<text x="40" y="426" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">14.</tspan> Lead</text>
<text x="40" y="452" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">15.</tspan> Tin</text>
<text x="40" y="478" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">16.</tspan> Nickel (active)</text>
<text x="40" y="504" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">17.</tspan> Inconel nickel-chromium alloy (active)</text>
<text x="40" y="530" font-size="14" fill="#111"><tspan font-weight="bold" fill="#555">18.</tspan> Hastelloy alloy C (active)</text>
