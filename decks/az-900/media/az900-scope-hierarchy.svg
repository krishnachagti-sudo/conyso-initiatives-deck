<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Azure's four levels of management scope</title>
  <rect width="480" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <g stroke="#1f4e79" stroke-width="2">
    <rect x="90" y="16" width="300" height="50" rx="8" fill="#dbe8f5"/>
    <rect x="90" y="96" width="300" height="50" rx="8" fill="#e6f0f9"/>
    <rect x="90" y="176" width="300" height="50" rx="8" fill="#eef5fb"/>
    <rect x="90" y="256" width="300" height="50" rx="8" fill="#f6fafd"/>
  </g>
  <g fill="#111111" text-anchor="middle" font-weight="bold">
    <text x="240" y="46">Management groups</text>
    <text x="240" y="126">Subscriptions</text>
    <text x="240" y="206">Resource groups</text>
    <text x="240" y="286">Resources</text>
  </g>
  <g stroke="#555555" stroke-width="2" marker-end="url(#a)">
    <line x1="240" y1="66" x2="240" y2="92"/>
    <line x1="240" y1="146" x2="240" y2="172"/>
    <line x1="240" y1="226" x2="240" y2="252"/>
  </g>
  <text x="420" y="170" fill="#333333" font-size="13" text-anchor="middle" transform="rotate(90 420 170)">settings inherit downwards</text>
</svg>
