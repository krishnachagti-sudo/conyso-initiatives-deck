<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 299" width="900" height="299" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="299" fill="#ffffff"/><text x="16" y="30" font-size="17" font-weight="700" fill="#111">How the unique, active committer count changes (GitHub’s example)</text><rect x="12" y="44" width="876" height="28" fill="#e8eef6"/><text x="16" y="63" font-size="13" font-weight="700" fill="#111">Date</text><text x="120" y="63" font-size="13" font-weight="700" fill="#111">Events during the month</text><text x="520" y="63" font-size="13" font-weight="700" fill="#111">Count</text><text x="610" y="63" font-size="13" font-weight="700" fill="#111">Effect on billing</text><text x="16" y="91" font-size="13" fill="#111">15 April</text><text x="120" y="91" font-size="13" fill="#111">Both products enabled on repository X, which had</text><text x="120" y="108" font-size="13" fill="#111">50 committers in the past 90 days</text><text x="540" y="91" font-size="15" font-weight="700" fill="#1f4e8c">50</text><text x="610" y="91" font-size="13" fill="#111">Billing begins for 50 committers</text><rect x="12" y="118" width="876" height="46" fill="#f5f5f5"/><text x="16" y="137" font-size="13" fill="#111">1 May</text><text x="120" y="137" font-size="13" fill="#111">Developer A stops committing to X; A’s</text><text x="120" y="154" font-size="13" fill="#111">contributions still count for 90 days</text><text x="540" y="137" font-size="15" font-weight="700" fill="#1f4e8c">50</text><text x="610" y="137" font-size="13" fill="#111">No immediate change</text><text x="16" y="183" font-size="13" fill="#111">1 August</text><text x="120" y="183" font-size="13" fill="#111">90 days have passed since A’s last contribution</text><text x="540" y="183" font-size="15" font-weight="700" fill="#1f4e8c">49</text><text x="610" y="183" font-size="13" fill="#111">A is removed from the billing count</text><rect x="12" y="193" width="876" height="46" fill="#f5f5f5"/><text x="16" y="212" font-size="13" fill="#111">15 August</text><text x="120" y="212" font-size="13" fill="#111">Both products enabled on repository Y: 20 recent</text><text x="120" y="229" font-size="13" fill="#111">contributors, 10 of whom also work on X</text><text x="540" y="212" font-size="15" font-weight="700" fill="#1f4e8c">59</text><text x="610" y="212" font-size="13" fill="#111">Billing rises by the 10 new unique</text><text x="610" y="229" font-size="13" fill="#111">contributors</text><text x="16" y="258" font-size="13" fill="#111">16 August</text><text x="120" y="258" font-size="13" fill="#111">Both products disabled on X; 10 of its developers</text><text x="120" y="275" font-size="13" fill="#111">still work on Y (20 contributors)</text><text x="540" y="258" font-size="15" font-weight="700" fill="#1f4e8c">20</text><text x="610" y="258" font-size="13" fill="#111">X is billed to the end of the monthly</text><text x="610" y="275" font-size="13" fill="#111">cycle; 20 from the next cycle</text><line x1="12" y1="285" x2="888" y2="285" stroke="#999"/></svg>