<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">SP 800-60 security categorisation process in four steps</title>
  <rect width="720" height="200" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <g font-size="13" fill="#111" text-anchor="middle">
    <rect x="10" y="50" width="150" height="90" rx="8" fill="#eef3fb" stroke="#335"/>
    <text x="85" y="75" font-weight="bold">Step 1</text>
    <text x="85" y="97">Identify</text><text x="85" y="115">information types</text>
    <rect x="190" y="50" width="150" height="90" rx="8" fill="#eef3fb" stroke="#335"/>
    <text x="265" y="75" font-weight="bold">Step 2</text>
    <text x="265" y="97">Select provisional</text><text x="265" y="115">impact levels</text>
    <rect x="370" y="50" width="150" height="90" rx="8" fill="#eef3fb" stroke="#335"/>
    <text x="445" y="75" font-weight="bold">Step 3</text>
    <text x="445" y="97">Review, adjust and</text><text x="445" y="115">finalise impact levels</text>
    <rect x="550" y="50" width="160" height="90" rx="8" fill="#eef3fb" stroke="#335"/>
    <text x="630" y="75" font-weight="bold">Step 4</text>
    <text x="630" y="97">Assign system</text><text x="630" y="115">security category</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)">
    <line x1="160" y1="95" x2="187" y2="95"/><line x1="340" y1="95" x2="367" y2="95"/><line x1="520" y1="95" x2="547" y2="95"/>
  </g>
  <text x="360" y="180" font-size="12" fill="#444" text-anchor="middle">Output: security categorisation, which drives control selection (FIPS 200 / SP 800-53)</text>
</svg>
