<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 470" width="790" height="470"><rect width="790" height="470" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b57"/></marker></defs><rect x="20" y="330" width="210" height="92" rx="10" fill="#eef2f5" stroke="#1f3b57" stroke-width="2"/><text x="125.0" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Current State</text><text x="125.0" y="380" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">where you are today</text><rect x="200" y="240" width="210" height="92" rx="10" fill="#dff0e3" stroke="#1f3b57" stroke-width="2"/><text x="305.0" y="266" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Immediate Tactical Goal</text><text x="305.0" y="290" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">current focus of</text><text x="305.0" y="309" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">improvement efforts</text><rect x="380" y="150" width="210" height="92" rx="10" fill="#d7ebf5" stroke="#1f3b57" stroke-width="2"/><text x="485.0" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Intermediate Goal</text><text x="485.0" y="200" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">shows you are on the path;</text><text x="485.0" y="219" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">path somewhat uncertain</text><rect x="560" y="40" width="210" height="92" rx="10" fill="#fbe9c9" stroke="#1f3b57" stroke-width="2"/><text x="665.0" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Strategic Goal</text><text x="665.0" y="90" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">aspirational; far away,</text><text x="665.0" y="109" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">with many uncertainties</text><line x1="125" y1="330" x2="220" y2="300" stroke="#1f3b57" stroke-width="2" marker-end="url(#a)"/><line x1="305" y1="240" x2="400" y2="210" stroke="#1f3b57" stroke-width="2" marker-end="url(#a)"/><line x1="485" y1="150" x2="580" y2="100" stroke="#1f3b57" stroke-width="2" marker-end="url(#a)"/><text x="20" y="455" font-size="14" fill="#33475b" font-family="Helvetica, Arial, sans-serif">Each step is reached by small, measured experiments; goals are adapted as you learn.</text></svg>