<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480"><rect width="780" height="480" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b57"/></marker></defs><rect x="280" y="30" width="220" height="100" rx="10" fill="#dff0e3" stroke="#1f3b57" stroke-width="2"/><text x="390.0" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">1. Form a hypothesis</text><text x="390.0" y="80" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">an idea to move toward the</text><text x="390.0" y="99" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Immediate Tactical Goal</text><rect x="510" y="190" width="220" height="100" rx="10" fill="#d7ebf5" stroke="#1f3b57" stroke-width="2"/><text x="620.0" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">2. Run the experiment</text><text x="620.0" y="240" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">make the change;</text><text x="620.0" y="259" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">gather data</text><rect x="280" y="350" width="220" height="100" rx="10" fill="#fbe9c9" stroke="#1f3b57" stroke-width="2"/><text x="390.0" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">3. Inspect results</text><text x="390.0" y="400" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">did the measures</text><text x="390.0" y="419" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">improve?</text><rect x="50" y="190" width="220" height="100" rx="10" fill="#f3dde6" stroke="#1f3b57" stroke-width="2"/><text x="160.0" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">4. Adapt</text><text x="160.0" y="240" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">goals or approach,</text><text x="160.0" y="259" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">from what you learned</text><line x1="500" y1="80" x2="620" y2="190" stroke="#1f3b57" stroke-width="2.5" marker-end="url(#a)"/><line x1="620" y1="290" x2="500" y2="400" stroke="#1f3b57" stroke-width="2.5" marker-end="url(#a)"/><line x1="280" y1="400" x2="160" y2="290" stroke="#1f3b57" stroke-width="2.5" marker-end="url(#a)"/><line x1="160" y1="190" x2="280" y2="80" stroke="#1f3b57" stroke-width="2.5" marker-end="url(#a)"/><text x="390" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3b57" font-family="Helvetica, Arial, sans-serif">Experiment Loop</text></svg>