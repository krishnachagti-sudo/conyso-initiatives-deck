<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"><rect width="780" height="400" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b57"/></marker></defs><text x="390" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a7a1e" font-family="Helvetica, Arial, sans-serif">Market value: reflects customer outcomes</text><rect x="40" y="50" width="330" height="110" rx="10" fill="#d7ebf5" stroke="#1f3b57" stroke-width="2"/><text x="205.0" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Unrealized Value (UV)</text><text x="205.0" y="100" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">potential future value if all potential</text><text x="205.0" y="119" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">customers’ needs were met</text><rect x="410" y="50" width="330" height="110" rx="10" fill="#d7ebf5" stroke="#1f3b57" stroke-width="2"/><text x="575.0" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Current Value (CV)</text><text x="575.0" y="100" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">value the product</text><text x="575.0" y="119" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">delivers today</text><line x1="20" y1="195" x2="760" y2="195" stroke="#5a7a1e" stroke-width="2" stroke-dasharray="8 6"/><rect x="40" y="230" width="330" height="110" rx="10" fill="#fbe9c9" stroke="#1f3b57" stroke-width="2"/><text x="205.0" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Ability to Innovate (A2I)</text><text x="205.0" y="280" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">effectiveness in delivering</text><text x="205.0" y="299" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">new capabilities</text><rect x="410" y="230" width="330" height="110" rx="10" fill="#fbe9c9" stroke="#1f3b57" stroke-width="2"/><text x="575.0" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#10202f" font-family="Helvetica, Arial, sans-serif">Time-to-Market (T2M)</text><text x="575.0" y="280" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">how quickly it can deliver and</text><text x="575.0" y="299" text-anchor="middle" font-size="14" fill="#10202f" font-family="Helvetica, Arial, sans-serif">learn from experiment feedback</text><text x="390" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00" font-family="Helvetica, Arial, sans-serif">Organizational capability: ability to deliver those outcomes</text></svg>