<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>The GitOps loop: an agent pulls the desired state from Git, compares it with the cluster's actual state and applies the difference</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10245a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <rect x="16" y="24" width="180" height="96" rx="10" fill="#e8eefc" stroke="#1f3f8f" stroke-width="2"/>
  <text x="32" y="54" font-size="18" font-weight="bold" fill="#10245a">Git (state store)</text>
  <text x="32" y="78" font-size="13" fill="#10245a">desired state, declarative,</text>
  <text x="32" y="96" font-size="13" fill="#10245a">versioned and immutable</text>
  <rect x="236" y="24" width="168" height="96" rx="10" fill="#fdf1dc" stroke="#7a4a00" stroke-width="2"/>
  <text x="252" y="54" font-size="18" font-weight="bold" fill="#4a2c00">GitOps agent</text>
  <text x="252" y="78" font-size="13" fill="#4a2c00">runs with the system</text>
  <text x="252" y="96" font-size="13" fill="#4a2c00">it manages</text>
  <rect x="444" y="24" width="180" height="96" rx="10" fill="#e8eefc" stroke="#1f3f8f" stroke-width="2"/>
  <text x="460" y="54" font-size="18" font-weight="bold" fill="#10245a">Cluster</text>
  <text x="460" y="78" font-size="13" fill="#10245a">actual state</text>
  <line x1="236" y1="60" x2="200" y2="60" stroke="#10245a" stroke-width="2" marker-end="url(#a)"/>
  <text x="16" y="146" font-size="13" fill="#10245a">1. pulls desired state</text>
  <text x="16" y="164" font-size="13" fill="#10245a">(any time, not only on a push)</text>
  <line x1="444" y1="60" x2="408" y2="60" stroke="#10245a" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="146" font-size="13" fill="#10245a">2. observes actual state</text>
  <path d="M320,120 L320,270 L600,270 L600,124" fill="none" stroke="#10245a" stroke-width="2" marker-end="url(#a)"/>
  <text x="336" y="200" font-size="13" fill="#10245a">3. if they differ (drift or</text>
  <text x="336" y="218" font-size="13" fill="#10245a">a new version), applies the</text>
  <text x="336" y="236" font-size="13" fill="#10245a">desired state</text>
  <text x="16" y="312" font-size="14" font-weight="bold" fill="#10245a">Repeats continuously: this is reconciliation.</text>
</svg>
