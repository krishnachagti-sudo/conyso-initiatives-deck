<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Kubernetes Service types: ClusterIP inside NodePort inside LoadBalancer; ExternalName separate</title>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <rect x="16" y="16" width="400" height="328" rx="10" fill="#e8eefc" stroke="#1f3f8f" stroke-width="2"/>
  <text x="32" y="44" font-size="18" font-weight="bold" fill="#10245a">LoadBalancer</text>
  <text x="32" y="66" font-size="13" fill="#10245a">adds an external load balancer (e.g. from a cloud provider)</text>
  <rect x="40" y="84" width="352" height="240" rx="10" fill="#d4e0f7" stroke="#1f3f8f" stroke-width="2"/>
  <text x="56" y="112" font-size="18" font-weight="bold" fill="#10245a">NodePort</text>
  <text x="56" y="134" font-size="13" fill="#10245a">adds the same static port on every node</text>
  <text x="56" y="152" font-size="13" fill="#10245a">(default range 30000–32767)</text>
  <rect x="64" y="172" width="304" height="132" rx="10" fill="#ffffff" stroke="#1f3f8f" stroke-width="2"/>
  <text x="80" y="202" font-size="18" font-weight="bold" fill="#10245a">ClusterIP (default)</text>
  <text x="80" y="226" font-size="13" fill="#10245a">a cluster-internal virtual IP,</text>
  <text x="80" y="244" font-size="13" fill="#10245a">reachable only inside the cluster</text>
  <text x="80" y="276" font-size="13" fill="#10245a">Each outer type builds on the one inside it.</text>
  <rect x="436" y="16" width="188" height="170" rx="10" fill="#fdf1dc" stroke="#7a4a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="452" y="44" font-size="18" font-weight="bold" fill="#4a2c00">ExternalName</text>
  <text x="452" y="70" font-size="13" fill="#4a2c00">outside the nesting:</text>
  <text x="452" y="90" font-size="13" fill="#4a2c00">DNS returns a CNAME</text>
  <text x="452" y="110" font-size="13" fill="#4a2c00">to an external name;</text>
  <text x="452" y="130" font-size="13" fill="#4a2c00">no proxying of</text>
  <text x="452" y="150" font-size="13" fill="#4a2c00">any kind</text>
</svg>
