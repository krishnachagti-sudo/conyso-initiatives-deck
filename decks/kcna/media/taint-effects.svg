<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258" role="img"><title>Taint effects: NoSchedule, PreferNoSchedule and NoExecute</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="640" height="258" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000"><text x="320" y="28" font-size="17" text-anchor="middle" font-weight="bold">Taint effects on Pods without a matching toleration</text><rect x="30" y="50" width="170" height="36" fill="#e6e6e6" stroke="#000" stroke-width="1.5"/><text x="115.0" y="73" font-size="14" text-anchor="middle" font-weight="bold">Effect</text><rect x="200" y="50" width="205" height="36" fill="#e6e6e6" stroke="#000" stroke-width="1.5"/><text x="302.5" y="73" font-size="14" text-anchor="middle" font-weight="bold">New Pods</text><rect x="405" y="50" width="205" height="36" fill="#e6e6e6" stroke="#000" stroke-width="1.5"/><text x="507.5" y="73" font-size="14" text-anchor="middle" font-weight="bold">Pods already running</text><rect x="30" y="86" width="170" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="115.0" y="113" font-size="14" text-anchor="middle" font-weight="bold">NoSchedule</text><rect x="200" y="86" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="302.5" y="113" font-size="14" text-anchor="middle" font-weight="normal">not scheduled</text><rect x="405" y="86" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="507.5" y="113" font-size="14" text-anchor="middle" font-weight="normal">stay</text><rect x="30" y="130" width="170" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="115.0" y="157" font-size="14" text-anchor="middle" font-weight="bold">PreferNoSchedule</text><rect x="200" y="130" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="302.5" y="157" font-size="14" text-anchor="middle" font-weight="normal">avoided if possible</text><rect x="405" y="130" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="507.5" y="157" font-size="14" text-anchor="middle" font-weight="normal">stay</text><rect x="30" y="174" width="170" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="115.0" y="201" font-size="14" text-anchor="middle" font-weight="bold">NoExecute</text><rect x="200" y="174" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="302.5" y="201" font-size="14" text-anchor="middle" font-weight="normal">not scheduled</text><rect x="405" y="174" width="205" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="507.5" y="201" font-size="14" text-anchor="middle" font-weight="bold">evicted</text><text x="320" y="240" font-size="12" text-anchor="middle">A toleration with tolerationSeconds lets a Pod stay that long under NoExecute.</text></g></svg>