<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img"><title>The five Pod phases: Pending, Running, Succeeded, Failed and Unknown</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="640" height="390" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000"><text x="320" y="30" font-size="17" text-anchor="middle" font-weight="bold">The five Pod phases</text><rect x="40" y="110" width="150" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="115.0" y="131.66666666666666" font-size="14" text-anchor="middle" font-weight="bold">Pending</text><text x="115.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">accepted; containers</text><text x="115.0" y="167.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">not yet all set up</text><rect x="245" y="110" width="150" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="320.0" y="131.66666666666666" font-size="14" text-anchor="middle" font-weight="bold">Running</text><text x="320.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">bound to a node;</text><text x="320.0" y="167.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">≥1 running or restarting</text><rect x="450" y="55" width="160" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="530.0" y="76.66666666666667" font-size="14" text-anchor="middle" font-weight="bold">Succeeded</text><text x="530.0" y="94.66666666666667" font-size="12" text-anchor="middle" font-weight="normal">all containers ended</text><text x="530.0" y="112.66666666666667" font-size="12" text-anchor="middle" font-weight="normal">in success</text><rect x="450" y="165" width="160" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="530.0" y="186.66666666666666" font-size="14" text-anchor="middle" font-weight="bold">Failed</text><text x="530.0" y="204.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">all ended; at least</text><text x="530.0" y="222.66666666666666" font-size="12" text-anchor="middle" font-weight="normal">one in failure</text><line x1="190" y1="145" x2="243" y2="145" stroke="#000" stroke-width="2" marker-end="url(#a)"/><line x1="395" y1="135" x2="448" y2="95" stroke="#000" stroke-width="2" marker-end="url(#a)"/><line x1="395" y1="155" x2="448" y2="195" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="270" width="240" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/><text x="320.0" y="291.6666666666667" font-size="14" text-anchor="middle" font-weight="bold">Unknown</text><text x="320.0" y="309.6666666666667" font-size="12" text-anchor="middle" font-weight="normal">state could not be obtained</text><text x="320.0" y="327.6666666666667" font-size="12" text-anchor="middle" font-weight="normal">(usually node unreachable)</text><text x="320" y="370" font-size="12" text-anchor="middle">Phase is a high-level summary; CrashLoopBackOff and Terminating are display statuses, not phases.</text></g></svg>