<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Helvetica, Arial, sans-serif">
  <title>CNCF project stages: Sandbox, then Incubation, then Graduated; Archived for inactive projects</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10245a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <rect x="16" y="24" width="170" height="110" rx="10" fill="#ffffff" stroke="#1f3f8f" stroke-width="2"/>
  <text x="32" y="54" font-size="18" font-weight="bold" fill="#10245a">Sandbox</text>
  <text x="32" y="78" font-size="13" fill="#10245a">experimental,</text>
  <text x="32" y="96" font-size="13" fill="#10245a">early in development;</text>
  <text x="32" y="114" font-size="13" fill="#10245a">breaking changes likely</text>
  <rect x="234" y="24" width="170" height="110" rx="10" fill="#d4e0f7" stroke="#1f3f8f" stroke-width="2"/>
  <text x="250" y="54" font-size="18" font-weight="bold" fill="#10245a">Incubation</text>
  <text x="250" y="78" font-size="13" fill="#10245a">gaining adoption;</text>
  <text x="250" y="96" font-size="13" fill="#10245a">more stable, versioned</text>
  <text x="250" y="114" font-size="13" fill="#10245a">APIs</text>
  <rect x="452" y="24" width="172" height="110" rx="10" fill="#a9c1ef" stroke="#1f3f8f" stroke-width="2"/>
  <text x="468" y="54" font-size="18" font-weight="bold" fill="#10245a">Graduated</text>
  <text x="468" y="78" font-size="13" fill="#10245a">highly mature;</text>
  <text x="468" y="96" font-size="13" fill="#10245a">production-proven by</text>
  <text x="468" y="114" font-size="13" fill="#10245a">its adopters</text>
  <line x1="186" y1="79" x2="230" y2="79" stroke="#10245a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="404" y1="79" x2="448" y2="79" stroke="#10245a" stroke-width="2" marker-end="url(#a)"/>
  <text x="16" y="170" font-size="13" fill="#10245a">Projects join at Sandbox or apply directly for Incubation.</text>
  <text x="16" y="190" font-size="13" fill="#10245a">The TOC checks each move by due diligence, then votes.</text>
  <rect x="452" y="154" width="172" height="86" rx="10" fill="#f2f2f2" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="468" y="180" font-size="18" font-weight="bold" fill="#333333">Archived</text>
  <text x="468" y="204" font-size="13" fill="#333333">inactive or no longer</text>
  <text x="468" y="222" font-size="13" fill="#333333">recommended</text>
</svg>
