<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" width="640" height="395" role="img"><title>A Deployment owns ReplicaSets, which own Pods, during a rolling update</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="640" height="395" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000"><text x="320" y="28" font-size="17" text-anchor="middle" font-weight="bold">Rolling update of a Deployment (4 desired Pods)</text><rect x="220" y="45" width="200" height="55" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="320.0" y="68.16666666666667" font-size="14" text-anchor="middle" font-weight="bold">Deployment</text><text x="320.0" y="86.16666666666667" font-size="12" text-anchor="middle" font-weight="normal">desired: 4 × image v2</text><rect x="40" y="150" width="240" height="55" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="160.0" y="173.16666666666666" font-size="14" text-anchor="middle" font-weight="bold">ReplicaSet (revision 1)</text><text x="160.0" y="191.16666666666666" font-size="12" text-anchor="middle" font-weight="normal">old, image v1: scaling down</text><rect x="360" y="150" width="240" height="55" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="480.0" y="173.16666666666666" font-size="14" text-anchor="middle" font-weight="bold">ReplicaSet (revision 2)</text><text x="480.0" y="191.16666666666666" font-size="12" text-anchor="middle" font-weight="normal">new, image v2: scaling up</text><line x1="290" y1="100" x2="180" y2="148" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="222" y="122" font-size="12" text-anchor="end">owns</text><line x1="350" y1="100" x2="460" y2="148" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="418" y="122" font-size="12" text-anchor="start">owns</text><rect x="55" y="255" width="65" height="45" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="87.5" y="273.3333333333333" font-size="13" text-anchor="middle" font-weight="bold">Pod</text><text x="87.5" y="290.3333333333333" font-size="11" text-anchor="middle" font-weight="normal">v1</text><line x1="160" y1="205" x2="87" y2="253" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="255" width="65" height="45" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="162.5" y="273.3333333333333" font-size="13" text-anchor="middle" font-weight="bold">Pod</text><text x="162.5" y="290.3333333333333" font-size="11" text-anchor="middle" font-weight="normal">v1</text><line x1="160" y1="205" x2="162" y2="253" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="205" y="255" width="65" height="45" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="237.5" y="273.3333333333333" font-size="13" text-anchor="middle" font-weight="bold">Pod</text><text x="237.5" y="290.3333333333333" font-size="11" text-anchor="middle" font-weight="normal">v1</text><line x1="160" y1="205" x2="237" y2="253" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="395" y="255" width="65" height="45" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="427.5" y="273.3333333333333" font-size="13" text-anchor="middle" font-weight="bold">Pod</text><text x="427.5" y="290.3333333333333" font-size="11" text-anchor="middle" font-weight="normal">v2</text><line x1="480" y1="205" x2="427" y2="253" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="255" width="65" height="45" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="502.5" y="273.3333333333333" font-size="13" text-anchor="middle" font-weight="bold">Pod</text><text x="502.5" y="290.3333333333333" font-size="11" text-anchor="middle" font-weight="normal">v2</text><line x1="480" y1="205" x2="502" y2="253" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="320" y="335" font-size="13" text-anchor="middle">Defaults: maxUnavailable 25%, maxSurge 25%.</text><text x="320" y="355" font-size="13" text-anchor="middle">With 4 desired Pods: at least 3 available, at most 5 in total at any moment.</text><text x="320" y="375" font-size="12" text-anchor="middle">Old ReplicaSets are kept (default 10) so the Deployment can roll back.</text></g></svg>