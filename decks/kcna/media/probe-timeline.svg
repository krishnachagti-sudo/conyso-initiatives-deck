<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 305" width="660" height="305" role="img"><title>Timeline of startup, liveness and readiness probes and what their failures do</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="660" height="305" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000"><text x="330" y="28" font-size="17" text-anchor="middle" font-weight="bold">Probes over a container’s life</text><line x1="40" y1="75" x2="630" y2="75" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="40" y="65" font-size="12">container starts</text><text x="630" y="65" font-size="12" text-anchor="end">time</text><rect x="40" y="95" width="200" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="140.0" y="112.33333333333333" font-size="13" text-anchor="middle" font-weight="bold">Startup probe</text><text x="140.0" y="129.33333333333331" font-size="11" text-anchor="middle" font-weight="normal">runs only at startup;</text><text x="140.0" y="146.33333333333331" font-size="11" text-anchor="middle" font-weight="normal">the others wait</text><line x1="245" y1="80" x2="245" y2="170" stroke="#000" stroke-width="2" stroke-dasharray="4 4"/><text x="250" y="90" font-size="11">startup probe succeeds</text><rect x="255" y="97" width="375" height="28" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="442.5" y="115.33333333333333" font-size="13" text-anchor="middle" font-weight="bold">Liveness probe: runs periodically</text><rect x="255" y="130" width="375" height="30" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="442.5" y="149.33333333333334" font-size="13" text-anchor="middle" font-weight="bold">Readiness probe: runs periodically, for the whole life</text><rect x="40" y="215" width="280" height="75" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="180.0" y="239.83333333333334" font-size="13" text-anchor="middle" font-weight="bold">Liveness (or startup) fails</text><text x="180.0" y="256.83333333333337" font-size="11" text-anchor="middle" font-weight="normal">kubelet kills the container;</text><text x="180.0" y="273.83333333333337" font-size="11" text-anchor="middle" font-weight="normal">restart policy applies</text><rect x="340" y="215" width="290" height="75" rx="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="485.0" y="239.83333333333334" font-size="13" text-anchor="middle" font-weight="bold">Readiness fails</text><text x="485.0" y="256.83333333333337" font-size="11" text-anchor="middle" font-weight="normal">Pod marked not ready: no traffic;</text><text x="485.0" y="273.83333333333337" font-size="11" text-anchor="middle" font-weight="normal">container keeps running</text><line x1="360" y1="127" x2="180" y2="213" stroke="#000" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="162" x2="485" y2="213" stroke="#000" stroke-width="2" marker-end="url(#a)"/></g></svg>