<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif" font-size="16">
<rect width="640" height="300" fill="#fff"/>
<g stroke="#000" stroke-width="2" fill="none">
<!-- left: voltmeter in parallel -->
<rect x="40" y="60" width="220" height="150"/>
<rect x="130" y="45" width="40" height="30" fill="#fff"/>
<rect x="12" y="115" width="56" height="40" fill="#fff"/>
<line x1="130" y1="60" x2="130" y2="20"/><line x1="170" y1="60" x2="170" y2="20"/>
<line x1="130" y1="20" x2="137" y2="20"/><line x1="163" y1="20" x2="170" y2="20"/>
<circle cx="150" cy="20" r="13" fill="#fff"/>
<!-- right: ammeter in series -->
<rect x="380" y="60" width="220" height="150"/>
<rect x="450" y="45" width="40" height="30" fill="#fff"/>
<rect x="352" y="115" width="56" height="40" fill="#fff"/>
<circle cx="600" cy="135" r="15" fill="#fff"/>
</g>
<g text-anchor="middle">
<text x="150" y="26" font-weight="bold">V</text>
<text x="150" y="98">component</text>
<text x="40" y="140" font-size="12">supply</text>
<text x="600" y="141" font-weight="bold">A</text>
<text x="470" y="98">component</text>
<text x="380" y="140" font-size="12">supply</text>
<text x="150" y="245" font-weight="bold">Voltmeter: in parallel</text>
<text x="150" y="268">connected across the component</text>
<text x="490" y="245" font-weight="bold">Ammeter: in series</text>
<text x="490" y="268">the current flows through the meter</text>
</g>
</svg>
