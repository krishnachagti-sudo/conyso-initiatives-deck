<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="560" height="300" fill="#ffffff"/>
  <polygon points="150,30 30,250 270,250" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="85" y1="150" x2="215" y2="150" stroke="#000" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="250" stroke="#000" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-size="34" font-weight="bold">E</text>
  <text x="110" y="220" text-anchor="middle" font-size="34" font-weight="bold">I</text>
  <text x="190" y="220" text-anchor="middle" font-size="34" font-weight="bold">R</text>
  <text x="280" y="288" text-anchor="middle" font-size="13">E = voltage (V) · I = current (A) · R = resistance (Ω)</text>
  <text x="310" y="70">Cover what you want:</text>
  <text x="310" y="105" font-weight="bold">I = E / R</text>
  <text x="310" y="135" font-weight="bold">E = I × R</text>
  <text x="310" y="165" font-weight="bold">R = E / I</text>
  <text x="310" y="215">Power (W):</text>
  <text x="310" y="245" font-weight="bold">P = I × E</text>
</svg>
