<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect x="20" y="110" width="130" height="60" fill="none" stroke="#000" stroke-width="2"/>
  <text x="85" y="145" text-anchor="middle">Your radio</text>
  <rect x="255" y="110" width="130" height="60" fill="none" stroke="#000" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle">Repeater</text>
  <rect x="490" y="110" width="130" height="60" fill="none" stroke="#000" stroke-width="2"/>
  <text x="555" y="137" text-anchor="middle">Other</text>
  <text x="555" y="155" text-anchor="middle">stations</text>
  <line x1="150" y1="140" x2="252" y2="140" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <line x1="385" y1="140" x2="487" y2="140" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="202" y="95" text-anchor="middle" font-weight="bold">INPUT</text>
  <text x="202" y="75" text-anchor="middle">repeater receives</text>
  <text x="437" y="95" text-anchor="middle" font-weight="bold">OUTPUT</text>
  <text x="437" y="75" text-anchor="middle">repeater transmits</text>
  <text x="320" y="215" text-anchor="middle" font-weight="bold">Offset = difference between the two frequencies</text>
  <text x="320" y="240" text-anchor="middle">Common offsets: 2 m ±600 kHz · 70 cm ±5 MHz</text>
  <text x="320" y="270" text-anchor="middle">Reverse function: listen on the repeater’s input frequency</text>
</svg>
