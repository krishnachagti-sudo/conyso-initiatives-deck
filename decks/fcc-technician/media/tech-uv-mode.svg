<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>Satellite U/V mode: uplink on 70 cm, downlink on 2 m</title>
  <rect width="480" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <!-- satellite -->
  <rect x="215" y="28" width="50" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="165" y="36" width="45" height="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="270" y="36" width="45" height="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="20" text-anchor="middle" font-weight="bold">Satellite</text>
  <!-- ground -->
  <line x1="20" y1="265" x2="460" y2="265" stroke="#000" stroke-width="2"/>
  <rect x="215" y="228" width="50" height="37" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="290" text-anchor="middle" font-weight="bold">Your station</text>
  <!-- uplink -->
  <line x1="205" y1="225" x2="205" y2="70" stroke="#000" stroke-width="3" marker-end="url(#a)"/>
  <text x="195" y="130" text-anchor="end" font-weight="bold">UPLINK (U)</text>
  <text x="195" y="150" text-anchor="end">70 cm band, UHF</text>
  <text x="195" y="170" text-anchor="end">420–450 MHz</text>
  <text x="195" y="190" text-anchor="end">you transmit</text>
  <!-- downlink -->
  <line x1="275" y1="65" x2="275" y2="222" stroke="#000" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/>
  <text x="285" y="130" font-weight="bold">DOWNLINK (V)</text>
  <text x="285" y="150">2 m band, VHF</text>
  <text x="285" y="170">144–148 MHz</text>
  <text x="285" y="190">you listen</text>
</svg>
