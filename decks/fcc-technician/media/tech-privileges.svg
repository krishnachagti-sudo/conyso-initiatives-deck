<text x="42.0" y="213.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">10 m</text>
<text x="120.0" y="213.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">28.000–28.300 MHz</text>
<text x="330.0" y="213.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">CW, RTTY, data</text>
