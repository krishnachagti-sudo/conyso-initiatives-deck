<text x="30.0" y="52.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">47 CFR 97.301, 97.305, 97.307(f)(9)–(10), 97.313; eCFR as of 2026-09-22</text>
<text x="30.0" y="85.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">HF (200 W PEP maximum on these segments)</text>
