<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#fff"/>
<text x="30.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">Decibels as power ratios</text>
<rect x="30" y="48" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="72.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">+10 dB</text>
<text x="160.0" y="72.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">× 10</text>
<text x="230.0" y="72.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">20 W → 200 W (T5B11)</text>
<rect x="30" y="98" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="122.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">+6 dB</text>
<text x="160.0" y="122.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">× 4</text>
<text x="230.0" y="122.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">3 W → 12 W</text>
<rect x="30" y="148" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="172.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">+3 dB</text>
<text x="160.0" y="172.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">× 2</text>
<text x="230.0" y="172.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">5 W → 10 W (T5B09)</text>
<rect x="30" y="198" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="222.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">0 dB</text>
<text x="160.0" y="222.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">× 1</text>
<text x="230.0" y="222.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">no change</text>
<rect x="30" y="248" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="272.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">−3 dB</text>
<text x="160.0" y="272.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">÷ 2</text>
<text x="230.0" y="272.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">10 W → 5 W (half power)</text>
<rect x="30" y="298" width="100" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="80.0" y="322.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">−6 dB</text>
<text x="160.0" y="322.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000">÷ 4</text>
<text x="230.0" y="322.0" font-size="14" text-anchor="start" font-weight="normal" fill="#000">12 W → 3 W (T5B10)</text>
<text x="30.0" y="375.0" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Each 3 dB step doubles (or halves) the power.</text>
</svg>
