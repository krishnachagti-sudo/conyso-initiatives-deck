<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect width="660" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#000" stroke-width="2">
    <!-- Series: loop with battery on left, 3 resistors on top/right/bottom -->
    <path d="M40,90 V60 H80"/>
    <polyline points="80,60 85,50 95,70 105,50 115,70 125,50 135,70 140,60"/>
    <path d="M140,60 H250 V90"/>
    <polyline points="250,90 240,95 260,105 240,115 260,125 240,135 250,140"/>
    <path d="M250,140 V230 H200"/>
    <polyline points="200,230 195,220 185,240 175,220 165,240 155,220 145,240 140,230"/>
    <path d="M140,230 H40 V170"/>
    <!-- battery -->
    <line x1="25" y1="120" x2="55" y2="120"/>
    <line x1="32" y1="135" x2="48" y2="135" stroke-width="4"/>
    <path d="M40,90 V120 M40,135 V170"/>
    <!-- Parallel: battery on left, three resistors between two rails -->
    <path d="M380,90 V50 H620 M380,170 V230 H620"/>
    <line x1="365" y1="120" x2="395" y2="120"/>
    <line x1="372" y1="135" x2="388" y2="135" stroke-width="4"/>
    <path d="M380,90 V120 M380,135 V170"/>
    <path d="M460,50 V105"/><polyline points="460,105 450,110 470,120 450,130 470,140 450,150 460,155"/><path d="M460,155 V230"/>
    <path d="M540,50 V105"/><polyline points="540,105 530,110 550,120 530,130 550,140 530,150 540,155"/><path d="M540,155 V230"/>
    <path d="M620,50 V105"/><polyline points="620,105 610,110 630,120 610,130 630,140 610,150 620,155"/><path d="M620,155 V230"/>
  </g>
  <text x="145" y="275" text-anchor="middle" font-weight="bold">SERIES</text>
  <text x="145" y="300" text-anchor="middle">same current through every component</text>
  <text x="500" y="275" text-anchor="middle" font-weight="bold">PARALLEL</text>
  <text x="500" y="300" text-anchor="middle">same voltage across every component</text>
</svg>
