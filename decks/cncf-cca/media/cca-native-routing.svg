<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Native routing: no tunnel, the Linux routing table forwards Pod traffic</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <!-- node 1 -->
  <rect x="20" y="50" width="320" height="220" rx="8" fill="#f4f9f1" stroke="#4d8a3a"/>
  <text x="32" y="72" font-weight="bold" fill="#2e5a20">Node 1 (192.168.1.11)</text>
  <text x="32" y="92" font-size="12">PodCIDR 10.0.1.0/24</text>
  <rect x="40" y="104" width="120" height="40" rx="6" fill="#fff" stroke="#4d8a3a"/>
  <text x="100" y="129" text-anchor="middle">Pod 10.0.1.5</text>
  <rect x="40" y="160" width="280" height="90" rx="6" fill="#fdf6e3" stroke="#b58900"/>
  <text x="180" y="180" text-anchor="middle" font-weight="bold">Linux kernel routing table</text>
  <text x="180" y="204" text-anchor="middle" font-family="monospace" font-size="12">10.0.2.0/24 via 192.168.1.12</text>
  <text x="180" y="230" text-anchor="middle" font-size="11">route to the other node's PodCIDR</text>
  <!-- node 2 -->
  <rect x="420" y="50" width="320" height="220" rx="8" fill="#f4f9f1" stroke="#4d8a3a"/>
  <text x="432" y="72" font-weight="bold" fill="#2e5a20">Node 2 (192.168.1.12)</text>
  <text x="432" y="92" font-size="12">PodCIDR 10.0.2.0/24</text>
  <rect x="600" y="104" width="120" height="40" rx="6" fill="#fff" stroke="#4d8a3a"/>
  <text x="660" y="129" text-anchor="middle">Pod 10.0.2.7</text>
  <rect x="440" y="160" width="280" height="90" rx="6" fill="#fdf6e3" stroke="#b58900"/>
  <text x="580" y="180" text-anchor="middle" font-weight="bold">Linux kernel routing table</text>
  <text x="580" y="204" text-anchor="middle" font-family="monospace" font-size="12">10.0.1.0/24 via 192.168.1.11</text>
  <text x="580" y="230" text-anchor="middle" font-size="11">route to the other node's PodCIDR</text>
  <!-- network -->
  <rect x="20" y="300" width="720" height="40" rx="6" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="380" y="325" text-anchor="middle">Node network: must be able to route PodCIDRs (plain packets, source 10.0.1.5, destination 10.0.2.7)</text>
  <line x1="100" y1="144" x2="100" y2="160" stroke="#333" marker-end="url(#a)"/>
  <line x1="180" y1="250" x2="180" y2="298" stroke="#333" marker-end="url(#a)"/>
  <line x1="580" y1="298" x2="580" y2="252" stroke="#333" marker-end="url(#a)"/>
  <line x1="660" y1="160" x2="660" y2="146" stroke="#333" marker-end="url(#a)"/>
</svg>
