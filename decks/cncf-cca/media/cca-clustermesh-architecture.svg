<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <!-- local cluster -->
  <rect x="15" y="15" width="440" height="390" rx="10" fill="#eef4fb" stroke="#4a78a8" stroke-width="1.5"/>
  <text x="30" y="38" font-weight="bold" font-size="15">Local cluster</text>
  <rect x="40" y="60" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="120" y="90" text-anchor="middle">kube-apiserver</text>
  <rect x="40" y="310" width="160" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="120" y="336" text-anchor="middle">Cilium agents</text>
  <text x="120" y="354" text-anchor="middle" font-size="11">(program the datapath)</text>
  <!-- clustermesh-apiserver pod -->
  <rect x="235" y="55" width="200" height="270" rx="8" fill="#fff8e6" stroke="#b07d12" stroke-width="1.5"/>
  <text x="335" y="76" text-anchor="middle" font-weight="bold">clustermesh-apiserver pod</text>
  <rect x="255" y="92" width="160" height="44" rx="5" fill="#fff" stroke="#333"/>
  <text x="335" y="112" text-anchor="middle">apiserver</text>
  <text x="335" y="127" text-anchor="middle" font-size="10.5">local state into local etcd</text>
  <rect x="255" y="160" width="160" height="44" rx="5" fill="#fff" stroke="#333"/>
  <text x="335" y="180" text-anchor="middle">etcd</text>
  <text x="335" y="195" text-anchor="middle" font-size="10.5">local state for remote clusters</text>
  <rect x="255" y="240" width="160" height="60" rx="5" fill="#fff" stroke="#333"/>
  <text x="335" y="262" text-anchor="middle">kvstoremesh</text>
  <text x="335" y="278" text-anchor="middle" font-size="10.5">syncs remote cluster state</text>
  <text x="335" y="291" text-anchor="middle" font-size="10.5">into the local cluster</text>
  <!-- arrows local -->
  <line x1="200" y1="85" x2="253" y2="110" stroke="#333" marker-end="url(#a)"/>
  <line x1="335" y1="136" x2="335" y2="158" stroke="#333" marker-end="url(#a)"/>
  <line x1="120" y1="112" x2="120" y2="308" stroke="#333" marker-end="url(#a)"/>
  <text x="126" y="210" font-size="11">local state</text>
  <line x1="255" y1="285" x2="202" y2="330" stroke="#333" marker-end="url(#a)"/>
  <text x="170" y="296" font-size="11">remote state</text>
  <!-- remote cluster -->
  <rect x="505" y="15" width="240" height="390" rx="10" fill="#eef4fb" stroke="#4a78a8" stroke-width="1.5"/>
  <text x="520" y="38" font-weight="bold" font-size="15">Remote cluster</text>
  <rect x="530" y="150" width="190" height="80" rx="8" fill="#fff8e6" stroke="#b07d12" stroke-width="1.5"/>
  <text x="625" y="178" text-anchor="middle" font-weight="bold">clustermesh-apiserver</text>
  <text x="625" y="196" text-anchor="middle" font-size="11">etcd exposed through a</text>
  <text x="625" y="211" text-anchor="middle" font-size="11">LoadBalancer or NodePort</text>
  <line x1="528" y1="215" x2="417" y2="262" stroke="#333" marker-end="url(#a)"/>
  <text x="470" y="258" font-size="11" text-anchor="middle">mTLS</text>
  <!-- data path note -->
  <line x1="202" y1="385" x2="700" y2="385" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#2e7d32">pod-to-pod traffic: directly between nodes, no proxy or gateway</text>
</svg>
