<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Cilium and Hubble components in a cluster</text>
  <!-- cluster-wide -->
  <rect x="20" y="40" width="605" height="110" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="32" y="60" font-weight="bold" fill="#1d3a66">Once per cluster</text>
  <rect x="40" y="72" width="200" height="60" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="140" y="96" text-anchor="middle" font-weight="bold">Cilium Operator</text>
  <text x="140" y="116" text-anchor="middle" font-size="11">cluster-wide duties</text>
  <rect x="280" y="72" width="200" height="60" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="380" y="96" text-anchor="middle" font-weight="bold">Hubble Relay</text>
  <text x="380" y="116" text-anchor="middle" font-size="11">cluster-wide flow API</text>
  <rect x="520" y="72" width="95" height="60" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="567" y="106" text-anchor="middle" font-weight="bold">Hubble UI</text>
  <rect x="645" y="72" width="95" height="60" rx="6" fill="#fff" stroke="#666" stroke-dasharray="4,3"/>
  <text x="692" y="100" text-anchor="middle" font-weight="bold">Hubble CLI</text>
  <text x="692" y="118" text-anchor="middle" font-size="11">client tool</text>
  <path d="M692,72 L692,52 L440,52 L440,70" fill="none" stroke="#333" marker-end="url(#a)"/>
  <line x1="520" y1="102" x2="482" y2="102" stroke="#333" marker-end="url(#a)"/>
  <!-- nodes -->
  <g>
    <rect x="20" y="200" width="350" height="210" rx="8" fill="#f4f9f1" stroke="#4d8a3a"/>
    <text x="32" y="220" font-weight="bold" fill="#2e5a20">Each node</text>
    <rect x="40" y="232" width="310" height="80" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="195" y="254" text-anchor="middle" font-weight="bold">Cilium agent (cilium-agent)</text>
    <rect x="80" y="266" width="230" height="36" rx="5" fill="#fdf6e3" stroke="#b58900"/>
    <text x="195" y="289" text-anchor="middle">Hubble server (embedded)</text>
    <rect x="40" y="324" width="145" height="36" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="112" y="347" text-anchor="middle">cilium-cni</text>
    <rect x="205" y="324" width="145" height="36" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="277" y="347" text-anchor="middle">cilium-dbg</text>
    <text x="195" y="390" text-anchor="middle" font-size="11">eBPF programs in the Linux kernel</text>
  </g>
  <g>
    <rect x="390" y="200" width="350" height="210" rx="8" fill="#f4f9f1" stroke="#4d8a3a"/>
    <text x="402" y="220" font-weight="bold" fill="#2e5a20">Each node</text>
    <rect x="410" y="232" width="310" height="80" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="565" y="254" text-anchor="middle" font-weight="bold">Cilium agent (cilium-agent)</text>
    <rect x="450" y="266" width="230" height="36" rx="5" fill="#fdf6e3" stroke="#b58900"/>
    <text x="565" y="289" text-anchor="middle">Hubble server (embedded)</text>
    <rect x="410" y="324" width="145" height="36" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="482" y="347" text-anchor="middle">cilium-cni</text>
    <rect x="575" y="324" width="145" height="36" rx="6" fill="#fff" stroke="#4d8a3a"/>
    <text x="647" y="347" text-anchor="middle">cilium-dbg</text>
    <text x="565" y="390" text-anchor="middle" font-size="11">eBPF programs in the Linux kernel</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <line x1="350" y1="134" x2="195" y2="264" stroke="#b58900" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <line x1="410" y1="134" x2="565" y2="264" stroke="#b58900" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#7a5c00">Relay connects to every Hubble server's gRPC API</text>
</svg>
