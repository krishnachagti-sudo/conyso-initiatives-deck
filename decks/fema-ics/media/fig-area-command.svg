<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="Arial, Helvetica, sans-serif">
  <style>
    .top  { fill:#f2f2f2; stroke:#333333; stroke-width:1.3; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.2; }
    .lbl  { font-size:12.5px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:11px; fill:#111111; text-anchor:middle; }
    .line { stroke:#555555; stroke-width:1.2; fill:none; }
  </style>

  <rect x="175" y="10" width="150" height="30" class="top"/>
  <text x="250" y="30" class="lbl" font-weight="bold">Area Command</text>

  <line x1="250" y1="40" x2="250" y2="55" class="line"/>
  <line x1="90" y1="55" x2="410" y2="55" class="line"/>

  <line x1="90" y1="55" x2="90" y2="68" class="line"/>
  <rect x="20" y="68" width="140" height="54" class="box"/>
  <text x="90" y="88" class="lbl2">Incident 1</text>
  <text x="90" y="102" class="lbl2" font-style="italic">own IC and ICS</text>
  <text x="90" y="115" class="lbl2" font-style="italic">organisation</text>

  <line x1="250" y1="55" x2="250" y2="68" class="line"/>
  <rect x="180" y="68" width="140" height="54" class="box"/>
  <text x="250" y="88" class="lbl2">Incident 2</text>
  <text x="250" y="102" class="lbl2" font-style="italic">own IC and ICS</text>
  <text x="250" y="115" class="lbl2" font-style="italic">organisation</text>

  <line x1="410" y1="55" x2="410" y2="68" class="line"/>
  <rect x="340" y="68" width="140" height="54" class="box"/>
  <text x="410" y="88" class="lbl2">Incident 3</text>
  <text x="410" y="102" class="lbl2" font-style="italic">own IC and ICS</text>
  <text x="410" y="115" class="lbl2" font-style="italic">organisation</text>

  <text x="250" y="155" class="lbl2" fill="#666666">Area Command oversees several incidents, each keeping its own</text>
  <text x="250" y="172" class="lbl2" fill="#666666">IC and ICS organisation — unlike Unified Command, where several</text>
  <text x="250" y="189" class="lbl2" fill="#666666">agencies jointly command one incident.</text>
</svg>
