<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="Arial, Helvetica, sans-serif">
  <style>
    .top  { fill:#f2f2f2; stroke:#333333; stroke-width:1.3; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.3; }
    .lbl  { font-size:12.5px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:11px; fill:#111111; text-anchor:middle; }
    .line { stroke:#555555; stroke-width:1.2; fill:none; }
  </style>

  <rect x="150" y="10" width="200" height="32" class="top"/>
  <text x="250" y="31" class="lbl" font-weight="bold">Planning Section Chief</text>

  <line x1="250" y1="42" x2="250" y2="58" class="line"/>
  <line x1="52" y1="58" x2="444" y2="58" class="line"/>

  <line x1="52"  y1="58" x2="52"  y2="72" class="line"/>
  <rect x="8" y="72" width="88" height="44" class="box"/>
  <text x="52" y="92" class="lbl2">Resources</text>
  <text x="52" y="106" class="lbl2">Unit</text>

  <line x1="150" y1="58" x2="150" y2="72" class="line"/>
  <rect x="106" y="72" width="88" height="44" class="box"/>
  <text x="150" y="92" class="lbl2">Situation</text>
  <text x="150" y="106" class="lbl2">Unit</text>

  <line x1="248" y1="58" x2="248" y2="72" class="line"/>
  <rect x="204" y="72" width="88" height="44" class="box"/>
  <text x="248" y="88" class="lbl2">Documentation</text>
  <text x="248" y="102" class="lbl2">Unit</text>

  <line x1="346" y1="58" x2="346" y2="72" class="line"/>
  <rect x="302" y="72" width="88" height="44" class="box"/>
  <text x="346" y="88" class="lbl2">Demobilization</text>
  <text x="346" y="102" class="lbl2">Unit</text>

  <line x1="444" y1="58" x2="444" y2="72" class="line"/>
  <rect x="400" y="72" width="88" height="44" class="box" stroke-dasharray="4,3"/>
  <text x="444" y="88" class="lbl2">Technical</text>
  <text x="444" y="102" class="lbl2">Specialists</text>

  <text x="250" y="145" class="lbl2" fill="#666666">Four Planning Section units, plus Technical Specialists</text>
  <text x="250" y="163" class="lbl2" fill="#666666">who may report directly to the Section Chief.</text>
</svg>
