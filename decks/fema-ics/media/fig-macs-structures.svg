<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210" font-family="Arial, Helvetica, sans-serif">
  <style>
    .top  { fill:#f2f2f2; stroke:#333333; stroke-width:1.3; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.2; }
    .lbl  { font-size:12.5px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:10.5px; fill:#111111; text-anchor:middle; }
    .line { stroke:#555555; stroke-width:1.2; fill:none; }
  </style>

  <rect x="100" y="8" width="300" height="30" class="top"/>
  <text x="250" y="28" class="lbl" font-weight="bold">NIMS Command and Coordination structures</text>

  <line x1="250" y1="38" x2="250" y2="52" class="line"/>
  <line x1="70" y1="52" x2="430" y2="52" class="line"/>

  <line x1="70" y1="52" x2="70" y2="66" class="line"/>
  <rect x="15" y="66" width="110" height="44" class="box"/>
  <text x="70" y="84" class="lbl2">Incident Command</text>
  <text x="70" y="98" class="lbl2">System (ICS)</text>

  <line x1="177" y1="52" x2="177" y2="66" class="line"/>
  <rect x="122" y="66" width="110" height="44" class="box"/>
  <text x="177" y="84" class="lbl2">Emergency</text>
  <text x="177" y="98" class="lbl2">Operations Centers</text>

  <line x1="323" y1="52" x2="323" y2="66" class="line"/>
  <rect x="268" y="66" width="110" height="44" class="box"/>
  <text x="323" y="84" class="lbl2">Multiagency</text>
  <text x="323" y="98" class="lbl2">Coordination Group</text>

  <line x1="430" y1="52" x2="430" y2="66" class="line"/>
  <rect x="375" y="66" width="110" height="44" class="box"/>
  <text x="430" y="84" class="lbl2">Joint Information</text>
  <text x="430" y="98" class="lbl2">System (JIS)</text>

  <text x="250" y="135" class="lbl2" fill="#666666">NIMS 2017's four Command and Coordination structures.</text>
  <text x="250" y="153" class="lbl2" fill="#666666">Only ICS commands on scene; the other three coordinate</text>
  <text x="250" y="170" class="lbl2" fill="#666666">information, resources and policy from off scene.</text>
</svg>
