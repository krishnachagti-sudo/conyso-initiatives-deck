<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill:#fff; stroke:#333; stroke-width:1.5; }
    .cs  { fill:#f2f2f2; stroke:#333; stroke-width:1.2; }
    .l   { font-size:12px; fill:#111; text-anchor:middle; }
    .l2  { font-size:11px; fill:#111; text-anchor:middle; }
    .g   { font-size:11px; fill:#555; font-style:italic; }
    .ln  { stroke:#555; stroke-width:1.2; fill:none; }
  </style>
  <!-- Incident Commander -->
  <rect x="205" y="10" width="150" height="32" class="box"/>
  <text x="280" y="31" class="l" font-weight="bold">Incident Commander</text>
  <!-- Command Staff, reporting directly to the Incident Commander -->
  <line x1="280" y1="42" x2="280" y2="170" class="ln"/>
  <line x1="280" y1="62" x2="380" y2="62" class="ln"/>
  <line x1="380" y1="62" x2="380" y2="132" class="ln"/>
  <line x1="380" y1="62" x2="396" y2="62" class="ln"/>
  <line x1="380" y1="97" x2="396" y2="97" class="ln"/>
  <line x1="380" y1="132" x2="396" y2="132" class="ln"/>
  <rect x="396" y="50" width="156" height="24" class="cs"/><text x="474" y="66" class="l2">Public Information Officer</text>
  <rect x="396" y="85" width="156" height="24" class="cs"/><text x="474" y="101" class="l2">Safety Officer</text>
  <rect x="396" y="120" width="156" height="24" class="cs"/><text x="474" y="136" class="l2">Liaison Officer</text>
  <text x="396" y="44" class="g">Command Staff</text>
  <!-- General Staff: the four Sections, side by side -->
  <line x1="70" y1="170" x2="490" y2="170" class="ln"/>
  <line x1="70" y1="170" x2="70" y2="190" class="ln"/>
  <line x1="210" y1="170" x2="210" y2="190" class="ln"/>
  <line x1="350" y1="170" x2="350" y2="190" class="ln"/>
  <line x1="490" y1="170" x2="490" y2="190" class="ln"/>
  <rect x="8" y="190" width="124" height="34" class="box"/><text x="70" y="211" class="l2">Operations Section</text>
  <rect x="148" y="190" width="124" height="34" class="box"/><text x="210" y="211" class="l2">Planning Section</text>
  <rect x="288" y="190" width="124" height="34" class="box"/><text x="350" y="211" class="l2">Logistics Section</text>
  <rect x="428" y="190" width="124" height="34" class="box"/><text x="490" y="204" class="l2">Finance/Administration</text><text x="490" y="218" class="l2">Section</text>
  <text x="8" y="162" class="g">General Staff</text>
  <text x="280" y="244" class="g" text-anchor="middle">Each Section Chief reports to the Incident Commander</text>
</svg>
