<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lvl  { fill:#ffffff; stroke:#333333; stroke-width:1.2; }
    .lbl  { font-size:12.5px; fill:#111111; }
    .lbl2 { font-size:11.5px; fill:#333333; text-anchor:end; }
    .arrow{ stroke:#888888; stroke-width:1; }
  </style>

  <text x="250" y="20" text-anchor="middle" class="lbl" font-weight="bold">ICS supervisory titles by organisational level</text>

  <rect x="150" y="35" width="200" height="30" class="lvl"/>
  <text x="90" y="55" class="lbl2">Section</text>
  <text x="250" y="55" text-anchor="middle" class="lbl">Chief</text>

  <rect x="150" y="75" width="200" height="30" class="lvl"/>
  <text x="90" y="95" class="lbl2">Branch</text>
  <text x="250" y="95" text-anchor="middle" class="lbl">Director</text>

  <rect x="150" y="115" width="200" height="30" class="lvl"/>
  <text x="90" y="135" class="lbl2">Division / Group</text>
  <text x="250" y="135" text-anchor="middle" class="lbl">Supervisor</text>

  <rect x="150" y="155" width="200" height="30" class="lvl"/>
  <text x="90" y="175" class="lbl2">Unit</text>
  <text x="250" y="175" text-anchor="middle" class="lbl">Leader</text>

  <rect x="150" y="195" width="200" height="30" class="lvl"/>
  <text x="90" y="211" class="lbl2">Strike Team /</text>
  <text x="90" y="224" class="lbl2">Task Force</text>
  <text x="250" y="215" text-anchor="middle" class="lbl">Leader</text>

  <text x="250" y="250" text-anchor="middle" class="lbl2" font-style="italic" fill="#666">Higher levels of the organisation at the top</text>
</svg>
