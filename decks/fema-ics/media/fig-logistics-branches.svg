<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="Arial, Helvetica, sans-serif">
  <style>
    .top  { fill:#f2f2f2; stroke:#333333; stroke-width:1.3; }
    .head { fill:#ffffff; stroke:#333333; stroke-width:1.2; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.1; }
    .lbl  { font-size:12.5px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:10.5px; fill:#111111; text-anchor:middle; }
    .line { stroke:#555555; stroke-width:1.2; fill:none; }
  </style>

  <rect x="175" y="8" width="150" height="30" class="top"/>
  <text x="250" y="28" class="lbl" font-weight="bold">Logistics Section</text>

  <line x1="250" y1="38" x2="250" y2="52" class="line"/>
  <line x1="130" y1="52" x2="370" y2="52" class="line"/>

  <line x1="130" y1="52" x2="130" y2="66" class="line"/>
  <rect x="35" y="66" width="190" height="26" class="head"/>
  <text x="130" y="84" class="lbl2" font-weight="bold">Service Branch</text>

  <line x1="370" y1="52" x2="370" y2="66" class="line"/>
  <rect x="275" y="66" width="190" height="26" class="head"/>
  <text x="370" y="84" class="lbl2" font-weight="bold">Support Branch</text>

  <!-- Service Branch units -->
  <rect x="40" y="102" width="90" height="36" class="box"/>
  <text x="85" y="118" class="lbl2">Communications</text>
  <text x="85" y="130" class="lbl2">Unit</text>

  <rect x="135" y="102" width="90" height="36" class="box"/>
  <text x="180" y="122" class="lbl2">Medical Unit</text>

  <rect x="40" y="144" width="90" height="36" class="box"/>
  <text x="85" y="164" class="lbl2">Food Unit</text>

  <!-- Support Branch units -->
  <rect x="280" y="102" width="90" height="36" class="box"/>
  <text x="325" y="122" class="lbl2">Supply Unit</text>

  <rect x="375" y="102" width="90" height="36" class="box"/>
  <text x="420" y="118" class="lbl2">Facilities</text>
  <text x="420" y="130" class="lbl2">Unit</text>

  <rect x="280" y="144" width="90" height="36" class="box"/>
  <text x="325" y="160" class="lbl2">Ground Support</text>
  <text x="325" y="172" class="lbl2">Unit</text>

  <text x="250" y="205" class="lbl2" fill="#666666">Service Branch supports responders directly (comms, medical, food);</text>
  <text x="250" y="222" class="lbl2" fill="#666666">Support Branch supplies and equips the incident (supply, facilities, ground).</text>
</svg>
