<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="Arial, Helvetica, sans-serif">
  <style>
    .outer{ fill:#f7f7f7; stroke:#333; stroke-width:1.3; }
    .box  { fill:#fff; stroke:#333; stroke-width:1.2; }
    .dash { fill:#fff; stroke:#333; stroke-width:1.2; stroke-dasharray:4 3; }
    .lbl  { font-size:12px; fill:#111; text-anchor:middle; }
    .lbl2 { font-size:11px; fill:#111; text-anchor:middle; }
    .note { font-size:11px; fill:#555; text-anchor:middle; }
    .line { stroke:#555; stroke-width:1.2; fill:none; }
  </style>
  <rect x="10" y="10" width="500" height="228" class="outer"/>
  <text x="260" y="30" class="lbl" font-weight="bold">Joint Field Office (JFO)</text>
  <text x="260" y="46" class="note">a temporary federal facility for coordinating response efforts</text>

  <rect x="160" y="60" width="200" height="32" class="box"/>
  <text x="260" y="81" class="lbl">Unified Coordination Group</text>
  <text x="260" y="108" class="note">senior leaders representing:</text>

  <line x1="80" y1="116" x2="440" y2="116" class="line"/>
  <line x1="80" y1="116" x2="80" y2="128" class="line"/>
  <line x1="200" y1="116" x2="200" y2="128" class="line"/>
  <line x1="320" y1="116" x2="320" y2="128" class="line"/>
  <line x1="440" y1="116" x2="440" y2="128" class="line"/>
  <rect x="24" y="128" width="112" height="40" class="box"/>
  <text x="80" y="144" class="lbl2">State, tribal,</text><text x="80" y="158" class="lbl2">territorial, insular</text>
  <rect x="144" y="128" width="112" height="40" class="box"/>
  <text x="200" y="152" class="lbl2">Federal</text>
  <rect x="264" y="128" width="112" height="40" class="dash"/>
  <text x="320" y="144" class="lbl2">Local</text><text x="320" y="158" class="lbl2">jurisdictions</text>
  <rect x="384" y="128" width="112" height="40" class="dash"/>
  <text x="440" y="144" class="lbl2">Private sector</text><text x="440" y="158" class="lbl2">and NGOs</text>

  <text x="380" y="184" class="note">dashed: in certain circumstances</text>
  <text x="260" y="208" class="note">The group leads the unified coordination staff. Unified coordination</text>
  <text x="260" y="224" class="note">supports on-scene response; it does not manage on-scene operations.</text>
</svg>
