<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="Arial, Helvetica, sans-serif">
  <style>
    .top  { fill:#f2f2f2; stroke:#333333; stroke-width:1.3; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.3; }
    .lbl  { font-size:12.5px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:10.5px; fill:#333333; text-anchor:middle; }
    .line { stroke:#555555; stroke-width:1.2; fill:none; }
  </style>

  <rect x="140" y="10" width="220" height="34" class="top"/>
  <text x="250" y="31" class="lbl" font-weight="bold">NIMS (2017)</text>

  <line x1="250" y1="44" x2="250" y2="60" class="line"/>
  <line x1="90" y1="60" x2="410" y2="60" class="line"/>

  <line x1="90" y1="60" x2="90" y2="75" class="line"/>
  <rect x="10" y="75" width="160" height="50" class="box"/>
  <text x="90" y="96" class="lbl2">Resource</text>
  <text x="90" y="110" class="lbl2">Management</text>

  <line x1="250" y1="60" x2="250" y2="75" class="line"/>
  <rect x="170" y="75" width="160" height="50" class="box"/>
  <text x="250" y="96" class="lbl2">Command and</text>
  <text x="250" y="110" class="lbl2">Coordination</text>

  <line x1="410" y1="60" x2="410" y2="75" class="line"/>
  <rect x="330" y="75" width="160" height="50" class="box"/>
  <text x="410" y="90" class="lbl2">Communications and</text>
  <text x="410" y="103" class="lbl2">Information</text>
  <text x="410" y="116" class="lbl2">Management</text>

  <text x="250" y="150" class="lbl2" fill="#666666">2008 had five components; 2017 has these three.</text>
  <text x="250" y="168" class="lbl2" fill="#666666">Command and Coordination includes ICS, EOCs,</text>
  <text x="250" y="184" class="lbl2" fill="#666666">MAC Groups and the Joint Information System.</text>
</svg>
