<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" font-family="Arial, Helvetica, sans-serif">
  <style>
    .p { stroke:#333; stroke-width:2.2; fill:none; }
    .d { fill:#333; }
    .t { font-size:12px; fill:#111; }
    .s { font-size:10.5px; fill:#555; }
    .h { font-size:13px; font-weight:bold; fill:#111; }
  </style>
  <text x="280" y="22" class="h" text-anchor="middle">The Planning P: one operational period</text>
  <!-- the loop, run clockwise, once per operational period -->
  <path class="p" d="M60,60 L420,60 Q520,60 520,160 Q520,260 420,260 L60,260 Z"/>
  <!-- the leg, performed only once, bottom to top -->
  <line class="p" x1="60" y1="260" x2="60" y2="450"/>

  <circle class="d" cx="60" cy="440" r="5"/><text x="74" y="444" class="t">1. Initial Response and Assessment</text>
  <circle class="d" cx="60" cy="400" r="5"/><text x="74" y="404" class="t">2. Agency Administrator Briefing <tspan class="s">(if appropriate)</tspan></text>
  <circle class="d" cx="60" cy="360" r="5"/><text x="74" y="364" class="t">3. Incident Briefing <tspan class="s">(ICS 201)</tspan></text>
  <circle class="d" cx="60" cy="320" r="5"/><text x="74" y="324" class="t">4. Initial Unified Command Meeting <tspan class="s">(if Unified Command)</tspan></text>
  <text x="360" y="444" class="s">The leg: done once, at the start</text>

  <circle class="d" cx="60" cy="160" r="5"/><text x="74" y="164" class="t">5. Objectives Development/Update</text>
  <circle class="d" cx="130" cy="60" r="5"/><text x="96" y="48" class="t">6. Strategy Meeting / Command and General Staff Meeting</text>
  <circle class="d" cx="400" cy="60" r="5"/><text x="330" y="82" class="s">7. Preparing for the</text><text x="330" y="95" class="s">Tactics Meeting</text>
  <circle class="d" cx="514" cy="115" r="5"/><text x="420" y="130" class="t">8. Tactics Meeting</text>
  <circle class="d" cx="514" cy="205" r="5"/><text x="384" y="192" class="s">9. Preparing for the</text><text x="384" y="205" class="s">Planning Meeting</text>
  <circle class="d" cx="400" cy="260" r="5"/><text x="350" y="282" class="t">10. Planning Meeting</text>
  <circle class="d" cx="260" cy="260" r="5"/><text x="178" y="248" class="t">11. IAP Preparation and Approval</text>
  <circle class="d" cx="130" cy="260" r="5"/><text x="96" y="282" class="t">12. Operational Period Briefing</text>
  <text x="150" y="200" class="s">The loop: repeated every operational period,</text>
  <text x="150" y="214" class="s">then back to step 5</text>
</svg>
