<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="Arial, Helvetica, sans-serif">
  <style>
    .cell { fill:#ffffff; stroke:#333333; stroke-width:1.3; }
    .lbl  { font-size:12px; fill:#111111; text-anchor:middle; }
    .num  { font-size:11px; fill:#666666; text-anchor:middle; }
  </style>
  <text x="250" y="20" class="lbl" font-weight="bold">The Seven Community Lifelines (NRF, 2019)</text>

  <!-- row 1: 4 cells -->
  <rect x="10"  y="35" width="115" height="55" class="cell"/>
  <text x="67" y="58" class="num">1</text>
  <text x="67" y="75" class="lbl">Safety and Security</text>

  <rect x="132" y="35" width="115" height="55" class="cell"/>
  <text x="189" y="58" class="num">2</text>
  <text x="189" y="72" class="lbl">Food, Water,</text>
  <text x="189" y="86" class="lbl">Shelter</text>

  <rect x="254" y="35" width="115" height="55" class="cell"/>
  <text x="311" y="58" class="num">3</text>
  <text x="311" y="75" class="lbl">Health and Medical</text>

  <rect x="376" y="35" width="115" height="55" class="cell"/>
  <text x="433" y="58" class="num">4</text>
  <text x="433" y="72" class="lbl">Energy</text>
  <text x="433" y="86" class="lbl">(Power and Fuel)</text>

  <!-- row 2: 3 cells, centred -->
  <rect x="71"  y="100" width="115" height="55" class="cell"/>
  <text x="128" y="123" class="num">5</text>
  <text x="128" y="140" class="lbl">Communications</text>

  <rect x="193" y="100" width="115" height="55" class="cell"/>
  <text x="250" y="123" class="num">6</text>
  <text x="250" y="140" class="lbl">Transportation</text>

  <rect x="315" y="100" width="115" height="55" class="cell"/>
  <text x="372" y="123" class="num">7</text>
  <text x="372" y="140" class="lbl">Hazardous Material</text>

  <text x="250" y="180" class="num">A lifeline is stabilised, not restored to normal, during response.</text>
</svg>
