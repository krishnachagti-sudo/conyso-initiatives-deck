<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="Arial, Helvetica, sans-serif">
  <style>
    .head { fill:#f2f2f2; stroke:#333333; stroke-width:1.2; }
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.1; }
    .lbl  { font-size:12px; fill:#111111; text-anchor:middle; font-weight:bold; }
    .lbl2 { font-size:10px; fill:#111111; text-anchor:middle; }
  </style>

  <!-- column 1: ICS or ICS-like -->
  <rect x="10" y="10" width="150" height="26" class="head"/>
  <text x="85" y="27" class="lbl2" font-weight="bold">ICS or ICS-like</text>
  <rect x="30" y="46" width="110" height="24" class="box"/>
  <text x="85" y="62" class="lbl2">Operations</text>
  <rect x="30" y="76" width="110" height="24" class="box"/>
  <text x="85" y="92" class="lbl2">Planning</text>
  <rect x="30" y="106" width="110" height="24" class="box"/>
  <text x="85" y="122" class="lbl2">Logistics</text>
  <rect x="30" y="136" width="110" height="24" class="box"/>
  <text x="85" y="152" class="lbl2">Finance/Admin.</text>

  <!-- column 2: ISM -->
  <rect x="175" y="10" width="150" height="26" class="head"/>
  <text x="250" y="27" class="lbl2" font-weight="bold">Incident Support Model</text>
  <rect x="195" y="46" width="110" height="24" class="box"/>
  <text x="250" y="62" class="lbl2">Situational Awareness</text>
  <rect x="195" y="76" width="110" height="24" class="box"/>
  <text x="250" y="92" class="lbl2">Planning Support</text>
  <rect x="195" y="106" width="110" height="24" class="box"/>
  <text x="250" y="122" class="lbl2">Resources Support</text>
  <rect x="195" y="136" width="110" height="24" class="box"/>
  <text x="250" y="152" class="lbl2">Center Support</text>

  <!-- column 3: Departmental -->
  <rect x="340" y="10" width="150" height="26" class="head"/>
  <text x="415" y="27" class="lbl2" font-weight="bold">Departmental</text>
  <rect x="360" y="46" width="110" height="24" class="box"/>
  <text x="415" y="62" class="lbl2">Department A</text>
  <rect x="360" y="76" width="110" height="24" class="box"/>
  <text x="415" y="92" class="lbl2">Department B</text>
  <rect x="360" y="106" width="110" height="24" class="box"/>
  <text x="415" y="122" class="lbl2">Department C</text>
  <rect x="360" y="136" width="110" height="24" class="box"/>
  <text x="415" y="152" class="lbl2">Department D</text>

  <text x="250" y="185" class="lbl2" fill="#666666">Three example EOC organisational structures (NIMS 2017)</text>
  <text x="250" y="205" class="lbl2" fill="#666666">Departmental keeps each agency in its own everyday reporting line;</text>
  <text x="250" y="222" class="lbl2" fill="#666666">the other two organise staff by incident-management function instead.</text>
</svg>
