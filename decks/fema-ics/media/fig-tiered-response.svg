<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box  { fill:#ffffff; stroke:#333333; stroke-width:1.3; }
    .lbl  { font-size:13px; fill:#111111; text-anchor:middle; }
    .lbl2 { font-size:11px; fill:#111111; text-anchor:middle; }
    .arrow{ stroke:#555555; stroke-width:1.6; fill:none; marker-end:url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="15" y="30" width="140" height="60" class="box"/>
  <text x="85" y="55" class="lbl">Local</text>
  <text x="85" y="73" class="lbl2">executed</text>

  <line x1="155" y1="60" x2="188" y2="60" class="arrow"/>

  <rect x="190" y="30" width="140" height="60" class="box"/>
  <text x="260" y="55" class="lbl">State/Tribal/</text>
  <text x="260" y="73" class="lbl2">Territorial: managed</text>

  <line x1="330" y1="60" x2="363" y2="60" class="arrow"/>

  <rect x="365" y="30" width="120" height="60" class="box"/>
  <text x="425" y="55" class="lbl">Federal</text>
  <text x="425" y="73" class="lbl2">supported</text>

  <text x="250" y="120" class="lbl2" fill="#666666">The NRF's optimal model for response:</text>
  <text x="250" y="138" class="lbl2" fill="#666666">"locally executed, state/tribal/territorial managed,</text>
  <text x="250" y="154" class="lbl2" fill="#666666">federally supported" — with private sector and</text>
  <text x="250" y="170" class="lbl2" fill="#666666">NGO engagement throughout.</text>
</svg>
