<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Three-tier approach to risk management (drawn from NIST SP 800-39, Figure 2)</title>
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Strategic risk</text>
  <rect x="120" y="40" width="320" height="58" rx="6" fill="#dbe7f5" stroke="#2b4c7e" stroke-width="2"/>
  <text x="280" y="66" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Tier 1: Organisation</text>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#1a1a1a">risk framing; context for all tiers</text>
  <rect x="120" y="128" width="320" height="58" rx="6" fill="#e7eef8" stroke="#2b4c7e" stroke-width="2"/>
  <text x="280" y="154" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Tier 2: Mission / business processes</text>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#1a1a1a">informed by Tier 1</text>
  <rect x="120" y="216" width="320" height="58" rx="6" fill="#f3f6fb" stroke="#2b4c7e" stroke-width="2"/>
  <text x="280" y="242" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Tier 3: Information systems</text>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#1a1a1a">guided by Tiers 1 and 2</text>
  <text x="280" y="306" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Tactical risk</text>
  <g stroke="#2b4c7e" stroke-width="2" fill="none">
    <line x1="80" y1="50" x2="80" y2="262"/>
    <polyline points="72,252 80,264 88,252"/>
    <line x1="480" y1="264" x2="480" y2="52"/>
    <polyline points="472,62 480,50 488,62"/>
  </g>
  <text x="60" y="160" text-anchor="middle" font-size="12" fill="#1a1a1a" transform="rotate(-90 60 160)">context and decisions flow down</text>
  <text x="506" y="160" text-anchor="middle" font-size="12" fill="#1a1a1a" transform="rotate(90 506 160)">feedback for continuous improvement</text>
</svg>
