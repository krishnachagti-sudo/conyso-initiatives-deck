<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="720" height="420" fill="#ffffff"/>
  <polygon points="300,30 380,30 440,140 240,140" fill="#fbe3e3" stroke="#1f2937"/>
  <polygon points="240,140 440,140 510,265 170,265" fill="#fff1d6" stroke="#1f2937"/>
  <polygon points="170,265 510,265 580,390 100,390" fill="#e3f5e6" stroke="#1f2937"/>
  <g fill="#111827" text-anchor="middle">
    <text x="340" y="80" font-weight="bold">End-to-end</text>
    <text x="340" y="100">few, complex, slower</text>
    <text x="340" y="200" font-weight="bold">Integration</text>
    <text x="340" y="220">(component integration)</text>
    <text x="340" y="325" font-weight="bold">Unit (component)</text>
    <text x="340" y="345">many, small, isolated, fast</text>
  </g>
  <line x1="640" y1="380" x2="640" y2="50" stroke="#1f2937" stroke-width="2"/>
  <polygon points="632,58 648,58 640,40" fill="#1f2937"/>
  <g fill="#111827" text-anchor="middle" font-size="13">
    <text x="640" y="30">Higher layer:</text>
  </g>
  <g fill="#111827" font-size="13">
    <text x="560" y="170">lower granularity</text>
    <text x="560" y="190">lower isolation</text>
    <text x="560" y="210">longer execution time</text>
  </g>
</svg>
