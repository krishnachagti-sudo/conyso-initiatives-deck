<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="275" y="28" text-anchor="middle" font-weight="bold" fill="#1f2937">Support the team</text>
  <text x="535" y="28" text-anchor="middle" font-weight="bold" fill="#1f2937">Critique the product</text>
  <text x="70" y="160" text-anchor="middle" font-weight="bold" fill="#1f2937" transform="rotate(-90 70 160)">Business facing</text>
  <text x="70" y="370" text-anchor="middle" font-weight="bold" fill="#1f2937" transform="rotate(-90 70 370)">Technology facing</text>
  <rect x="150" y="45" width="250" height="220" fill="#e0ecff" stroke="#1f2937"/>
  <rect x="410" y="45" width="250" height="220" fill="#fff1d6" stroke="#1f2937"/>
  <rect x="150" y="275" width="250" height="210" fill="#e3f5e6" stroke="#1f2937"/>
  <rect x="410" y="275" width="250" height="210" fill="#fbe3e3" stroke="#1f2937"/>
  <g fill="#111827">
    <text x="165" y="72" font-weight="bold" font-size="16">Q2</text>
    <text x="165" y="100">Functional tests</text>
    <text x="165" y="122">Examples</text>
    <text x="165" y="144">User story tests</text>
    <text x="165" y="166">User experience prototypes</text>
    <text x="165" y="188">API testing</text>
    <text x="165" y="210">Simulations</text>
    <text x="165" y="245" font-style="italic">Manual or automated</text>
    <text x="425" y="72" font-weight="bold" font-size="16">Q3</text>
    <text x="425" y="100">Exploratory testing</text>
    <text x="425" y="122">Usability testing</text>
    <text x="425" y="144">User acceptance testing</text>
    <text x="425" y="245" font-style="italic">User-oriented, often manual</text>
    <text x="165" y="302" font-weight="bold" font-size="16">Q1</text>
    <text x="165" y="330">Component tests</text>
    <text x="165" y="352">Component integration tests</text>
    <text x="165" y="465" font-style="italic">Automated, in continuous integration</text>
    <text x="425" y="302" font-weight="bold" font-size="16">Q4</text>
    <text x="425" y="330">Smoke tests</text>
    <text x="425" y="352">Non-functional tests</text>
    <text x="425" y="374">(except usability tests)</text>
    <text x="425" y="465" font-style="italic">Often automated</text>
