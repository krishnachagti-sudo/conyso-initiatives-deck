<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#555"/></marker></defs>
  <rect x="190" y="20" width="430" height="360" rx="10" fill="#eef5fb" stroke="#7a9cc0"/>
  <text x="200" y="40" fill="#234">Kubernetes cluster</text>
  <rect x="205" y="55" width="400" height="140" rx="8" fill="#f3f8ee" stroke="#8aa970"/>
  <text x="215" y="74" fill="#353">argo namespace</text>
  <rect x="220" y="90" width="170" height="90" rx="6" fill="#dbe7fb" stroke="#3b6fd6"/>
  <text x="305" y="120" text-anchor="middle" font-weight="bold">Workflow Controller</text>
  <text x="305" y="140" text-anchor="middle">Deployment</text>
  <text x="305" y="160" text-anchor="middle">does the reconciling</text>
  <rect x="420" y="90" width="170" height="90" rx="6" fill="#dbe7fb" stroke="#3b6fd6"/>
  <text x="505" y="120" text-anchor="middle" font-weight="bold">Argo Server</text>
  <text x="505" y="140" text-anchor="middle">Deployment</text>
  <text x="505" y="160" text-anchor="middle">serves the API</text>
  <rect x="205" y="215" width="220" height="150" rx="8" fill="#f3f8ee" stroke="#8aa970"/>
  <text x="215" y="234" fill="#353">user namespace</text>
  <rect x="220" y="250" width="190" height="100" rx="6" fill="#fff" stroke="#3b6fd6"/>
  <text x="315" y="285" text-anchor="middle" font-weight="bold">Workflows</text>
  <text x="315" y="305" text-anchor="middle">and the Pods</text>
  <text x="315" y="325" text-anchor="middle">generated from them</text>
  <rect x="445" y="250" width="160" height="100" rx="6" fill="#fff" stroke="#3b6fd6"/>
  <text x="525" y="295" text-anchor="middle" font-weight="bold">Kubernetes API</text>
  <rect x="15" y="100" width="150" height="70" rx="6" fill="#fff" stroke="#555"/>
  <text x="90" y="130" text-anchor="middle">User: Argo CLI,</text>
  <text x="90" y="150" text-anchor="middle">web browser</text>
  <rect x="15" y="230" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="90" y="252" text-anchor="middle">Artifact store</text>
  <text x="90" y="270" text-anchor="middle">(e.g. S3)</text>
  <rect x="15" y="300" width="150" height="50" rx="6" fill="#fff" stroke="#555"/>
  <text x="90" y="322" text-anchor="middle">Workflow archive</text>
  <text x="90" y="340" text-anchor="middle">(e.g. MySQL)</text>
  <path d="M165,120 C300,20 420,40 470,88" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M340,180 L500,248" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M530,180 L530,248" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M410,300 L443,300" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M260,180 L167,255" fill="none" stroke="#555" marker-end="url(#a)"/>
  <path d="M240,180 L167,320" fill="none" stroke="#555" marker-end="url(#a)"/>
