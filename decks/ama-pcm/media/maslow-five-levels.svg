<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t">
<title id="t">Maslow's five-level hierarchy of needs, drawn as a pyramid</title>
<rect width="520" height="400" fill="#ffffff"/>
<polygon points="190.0,20.0 330.0,20.0 364.0,84.0 156.0,84.0" fill="#dbe9f6" stroke="#1f3a5a" stroke-width="1.5"/>
<text x="260" y="57.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#10263d">Self-actualisation</text>
<polygon points="156.0,84.0 364.0,84.0 398.0,148.0 122.0,148.0" fill="#c8ddf0" stroke="#1f3a5a" stroke-width="1.5"/>
<text x="260" y="121.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#10263d">Esteem</text>
<polygon points="122.0,148.0 398.0,148.0 432.0,212.0 88.0,212.0" fill="#b3d0ea" stroke="#1f3a5a" stroke-width="1.5"/>
<text x="260" y="185.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#10263d">Love and belonging</text>
<polygon points="88.0,212.0 432.0,212.0 466.0,276.0 54.0,276.0" fill="#9ec3e4" stroke="#1f3a5a" stroke-width="1.5"/>
<text x="260" y="249.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#10263d">Safety</text>
<polygon points="54.0,276.0 466.0,276.0 500.0,340.0 20.0,340.0" fill="#89b6de" stroke="#1f3a5a" stroke-width="1.5"/>
<text x="260" y="313.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#10263d">Physiological</text>
<text x="260" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#10263d">Most fundamental needs at the base; self-actualisation at the top.</text>
<text x="260" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a4f63">Maslow did not draw a pyramid himself; this common portrayal came later.</text>
</svg>
