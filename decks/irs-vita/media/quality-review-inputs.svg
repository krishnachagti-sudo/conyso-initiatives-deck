<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What a quality review covers</title>
  <desc id="d">Form 13614-C, the source documents and the tax return each feed into the quality review, and the taxpayer takes part in it.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <g stroke="#333333" stroke-width="2" fill="#eef2f7">
    <rect x="20" y="30" width="180" height="60" rx="8"/>
    <rect x="230" y="30" width="180" height="60" rx="8"/>
    <rect x="440" y="30" width="180" height="60" rx="8"/>
    <rect x="200" y="200" width="240" height="70" rx="8" fill="#dbe7d3"/>
    <rect x="230" y="310" width="180" height="40" rx="8" fill="#f5ecd7"/>
  </g>
  <g fill="#111111" font-size="18" text-anchor="middle">
    <text x="110" y="66">Form 13614-C</text>
    <text x="320" y="66">Source documents</text>
    <text x="530" y="66">Tax return</text>
    <text x="320" y="242" font-weight="bold" font-size="20">Quality review</text>
    <text x="320" y="336">The taxpayer</text>
  </g>
  <g stroke="#333333" stroke-width="2" fill="none">
    <line x1="110" y1="90" x2="250" y2="198" marker-end="url(#a)"/>
    <line x1="320" y1="90" x2="320" y2="198" marker-end="url(#a)"/>
    <line x1="530" y1="90" x2="390" y2="198" marker-end="url(#a)"/>
    <line x1="320" y1="272" x2="320" y2="308" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="330" y="294" font-size="13" fill="#111111">interaction</text>
</svg>
