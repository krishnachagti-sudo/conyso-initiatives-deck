<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Required levels of evacuation (40 CFR 82.156, Table 1)</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="bold" fill="#1a1a1a">Required levels of evacuation (inches of Hg vacuum unless stated)</text>
  <g fill="#1a1a1a">
    <rect x="16" y="36" width="608" height="44" fill="#e8eef4"/>
    <text x="24" y="63" font-weight="bold">Type of appliance</text>
    <text x="370" y="55" font-weight="bold">Recovery equipment made</text>
    <text x="370" y="72" font-weight="bold">or imported before 15 Nov 1993</text>
    <text x="505" y="55" font-weight="bold">… on or after</text>
    <text x="505" y="72" font-weight="bold">15 Nov 1993</text>
    <line x1="16" y1="80" x2="624" y2="80" stroke="#8a97a3"/>
    <text x="24" y="104">Very high-pressure</text><text x="370" y="104">0</text><text x="505" y="104">0</text>
    <line x1="16" y1="118" x2="624" y2="118" stroke="#c9d1d8"/>
    <text x="24" y="142">High-pressure, full charge under 200 lb</text><text x="370" y="142">0</text><text x="505" y="142">0</text>
    <line x1="16" y1="156" x2="624" y2="156" stroke="#c9d1d8"/>
    <text x="24" y="180">High-pressure, 200 lb or more</text><text x="370" y="180">4</text><text x="505" y="180">10</text>
    <line x1="16" y1="194" x2="624" y2="194" stroke="#c9d1d8"/>
    <text x="24" y="218">Medium-pressure, under 200 lb</text><text x="370" y="218">4</text><text x="505" y="218">10</text>
    <line x1="16" y1="232" x2="624" y2="232" stroke="#c9d1d8"/>
    <text x="24" y="256">Medium-pressure, 200 lb or more</text><text x="370" y="256">4</text><text x="505" y="256">15</text>
    <line x1="16" y1="270" x2="624" y2="270" stroke="#c9d1d8"/>
    <text x="24" y="294">Low-pressure</text><text x="370" y="294">25 mm Hg absolute</text><text x="505" y="294">25 mm Hg absolute</text>
    <line x1="16" y1="308" x2="624" y2="308" stroke="#8a97a3"/>
    <text x="24" y="324" font-size="11" fill="#4a5560">Vacuum relative to standard atmospheric pressure of 29.9 inches Hg. High- and medium-pressure rows include isolated components.</text>
  </g>
</svg>
