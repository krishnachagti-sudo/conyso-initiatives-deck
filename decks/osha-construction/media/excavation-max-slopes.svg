<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Maximum allowable slopes, simple slope excavations 20 feet or less deep (H:V)</text>
  <!-- Stable rock: vertical -->
  <g transform="translate(40,50)">
    <polygon points="0,0 60,0 60,120 0,120" fill="#d9cbb0" stroke="#444"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#111" stroke-width="3"/>
    <line x1="60" y1="120" x2="110" y2="120" stroke="#444"/>
    <text x="55" y="150" text-anchor="middle" font-weight="bold" fill="#111">Stable rock</text>
    <text x="55" y="168" text-anchor="middle" fill="#111">Vertical sides</text>
  </g>
  <!-- Type A: 3/4:1 -->
  <g transform="translate(190,50)">
    <polygon points="0,0 20,0 110,120 0,120" fill="#d9cbb0" stroke="#444"/>
    <line x1="20" y1="0" x2="110" y2="120" stroke="#111" stroke-width="3"/>
    <line x1="110" y1="120" x2="140" y2="120" stroke="#444"/>
    <text x="70" y="150" text-anchor="middle" font-weight="bold" fill="#111">Type A soil</text>
    <text x="70" y="168" text-anchor="middle" fill="#111">¾ : 1</text>
  </g>
  <!-- Type B: 1:1 -->
  <g transform="translate(360,50)">
    <polygon points="0,0 10,0 130,120 0,120" fill="#d9cbb0" stroke="#444"/>
    <line x1="10" y1="0" x2="130" y2="120" stroke="#111" stroke-width="3"/>
    <line x1="130" y1="120" x2="150" y2="120" stroke="#444"/>
    <text x="75" y="150" text-anchor="middle" font-weight="bold" fill="#111">Type B soil</text>
    <text x="75" y="168" text-anchor="middle" fill="#111">1 : 1</text>
  </g>
  <!-- Type C: 1 1/2:1 -->
  <g transform="translate(530,50)">
    <polygon points="0,0 0,0 180,120 0,120" fill="#d9cbb0" stroke="#444"/>
    <line x1="0" y1="0" x2="180" y2="120" stroke="#111" stroke-width="3"/>
    <text x="90" y="150" text-anchor="middle" font-weight="bold" fill="#111">Type C soil</text>
    <text x="90" y="168" text-anchor="middle" fill="#111">1½ : 1</text>
  </g>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#333">Each thick line is an excavation face: horizontal run per 1 unit of vertical depth. Drawn to scale; not a design tool.</text>
</svg>
