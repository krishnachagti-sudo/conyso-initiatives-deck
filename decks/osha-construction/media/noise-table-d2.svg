<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Table D-2: permissible noise exposures (29 CFR 1926.52)</text>
  <g fill="#111">
    <text x="150" y="54" text-anchor="middle" font-weight="bold">Sound level, dBA slow response</text>
    <text x="410" y="54" text-anchor="middle" font-weight="bold">Duration per day, hours</text>
  </g>
  <line x1="40" y1="62" x2="520" y2="62" stroke="#444"/>
  <g fill="#111" text-anchor="middle">
    <text x="150" y="84">90</text><text x="410" y="84">8</text>
    <text x="150" y="112">92</text><text x="410" y="112">6</text>
    <text x="150" y="140">95</text><text x="410" y="140">4</text>
    <text x="150" y="168">97</text><text x="410" y="168">3</text>
    <text x="150" y="196">100</text><text x="410" y="196">2</text>
    <text x="150" y="224">102</text><text x="410" y="224">1½</text>
    <text x="150" y="252">105</text><text x="410" y="252">1</text>
    <text x="150" y="280">110</text><text x="410" y="280">½</text>
    <text x="150" y="308">115</text><text x="410" y="308">¼ or less</text>
  </g>
  <line x1="280" y1="66" x2="280" y2="316" stroke="#bbb"/>
  <line x1="40" y1="318" x2="520" y2="318" stroke="#444"/>
</svg>
