<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" font-family="Arial, sans-serif" font-size="13"><rect width="360" height="560" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect x="60" y="12" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="35" text-anchor="middle" fill="#111">Oil tank</text><line x1="180" y1="48" x2="180" y2="70" stroke="#333" marker-end="url(#a)"/><rect x="60" y="72" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="95" text-anchor="middle" fill="#111">Suction screen</text><line x1="180" y1="108" x2="180" y2="130" stroke="#333" marker-end="url(#a)"/><rect x="60" y="132" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="155" text-anchor="middle" fill="#111">Pressure pump (gear)</text><line x1="180" y1="168" x2="180" y2="190" stroke="#333" marker-end="url(#a)"/><rect x="60" y="192" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="215" text-anchor="middle" fill="#111">Full-flow filter (bypass valve)</text><line x1="180" y1="228" x2="180" y2="250" stroke="#333" marker-end="url(#a)"/><rect x="60" y="252" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="275" text-anchor="middle" fill="#111">Regulating valve</text><line x1="180" y1="288" x2="180" y2="310" stroke="#333" marker-end="url(#a)"/><rect x="60" y="312" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="335" text-anchor="middle" fill="#111">Manifold and drilled passages to bearings</text><line x1="180" y1="348" x2="180" y2="370" stroke="#333" marker-end="url(#a)"/><rect x="60" y="372" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="395" text-anchor="middle" fill="#111">Engine sumps</text><line x1="180" y1="408" x2="180" y2="430" stroke="#333" marker-end="url(#a)"/><rect x="60" y="432" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="455" text-anchor="middle" fill="#111">Scavenger pump</text><line x1="180" y1="468" x2="180" y2="490" stroke="#333" marker-end="url(#a)"/><rect x="60" y="492" width="240" height="36" rx="6" fill="#eef3f8" stroke="#335"/><text x="180" y="515" text-anchor="middle" fill="#111">Oil cooler with thermostat</text><path d="M300,510 H340 V30 H302" fill="none" stroke="#333" marker-end="url(#a)"/><text x="336" y="280" transform="rotate(90 336 280)" text-anchor="middle" fill="#111">back to tank</text><path d="M60,270 H24 V150 H58" fill="none" stroke="#333" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="18" y="210" transform="rotate(-90 18 210)" text-anchor="middle" fill="#111" font-size="11">excess to pump inlet</text></svg>