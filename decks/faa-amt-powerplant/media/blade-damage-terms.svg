<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="490" fill="#ffffff"/><text x="20" y="30" font-size="20" font-weight="bold" fill="#1a1a1a">Blade damage terms, appearance and usual causes</text><rect x="10" y="42" width="880" height="30" fill="#e6ecf2"/><text x="20" y="62" font-size="15" font-weight="bold" fill="#1a1a1a">Term</text><text x="170" y="62" font-size="15" font-weight="bold" fill="#1a1a1a">Appearance</text><text x="480" y="62" font-size="15" font-weight="bold" fill="#1a1a1a">Usual causes</text><text x="20" y="97" font-size="14" font-weight="bold" fill="#1a1a1a">Burr</text><text x="170" y="97" font-size="14"  fill="#1a1a1a">A ragged or turned-out edge</text><text x="480" y="97" font-size="14"  fill="#1a1a1a">Grinding or cutting operation</text><rect x="10" y="112" width="880" height="40" fill="#f5f7f9"/><text x="20" y="137" font-size="14" font-weight="bold" fill="#1a1a1a">Corrosion (pits)</text><text x="170" y="137" font-size="14"  fill="#1a1a1a">Breakdown of the surface; pitted appearance</text><text x="480" y="137" font-size="14"  fill="#1a1a1a">Corrosive agents, such as moisture</text><text x="20" y="177" font-size="14" font-weight="bold" fill="#1a1a1a">Crack</text><text x="170" y="177" font-size="14"  fill="#1a1a1a">A partial fracture (separation)</text><text x="480" y="177" font-size="11.5"  fill="#1a1a1a">Excessive stress, overloading, faulty processing, defective materials, overheating</text><rect x="10" y="192" width="880" height="40" fill="#f5f7f9"/><text x="20" y="217" font-size="14" font-weight="bold" fill="#1a1a1a">Dent</text><text x="170" y="217" font-size="14"  fill="#1a1a1a">Small, smoothly rounded hollow</text><text x="480" y="217" font-size="14"  fill="#1a1a1a">Striking of a part with a dull object</text><text x="20" y="257" font-size="14" font-weight="bold" fill="#1a1a1a">Gall</text><text x="170" y="257" font-size="14"  fill="#1a1a1a">Transfer of metal from one surface to another</text><text x="480" y="257" font-size="14"  fill="#1a1a1a">Severe rubbing</text><rect x="10" y="272" width="880" height="40" fill="#f5f7f9"/><text x="20" y="297" font-size="14" font-weight="bold" fill="#1a1a1a">Gouging</text><text x="170" y="297" font-size="14"  fill="#1a1a1a">Displacement of material; cutting or tearing effect</text><text x="480" y="297" font-size="14"  fill="#1a1a1a">Large foreign body between moving parts</text><text x="20" y="337" font-size="14" font-weight="bold" fill="#1a1a1a">Growth</text><text x="170" y="337" font-size="14"  fill="#1a1a1a">Elongation of blade</text><text x="480" y="337" font-size="14"  fill="#1a1a1a">Continued or excessive heat and centrifugal force</text><rect x="10" y="352" width="880" height="40" fill="#f5f7f9"/><text x="20" y="377" font-size="14" font-weight="bold" fill="#1a1a1a">Score</text><text x="170" y="377" font-size="14"  fill="#1a1a1a">Deep scratches</text><text x="480" y="377" font-size="14"  fill="#1a1a1a">Chips between surfaces</text><text x="20" y="417" font-size="14" font-weight="bold" fill="#1a1a1a">Scratch</text><text x="170" y="417" font-size="14"  fill="#1a1a1a">Narrow shallow marks</text><text x="480" y="417" font-size="14"  fill="#1a1a1a">Sand or fine foreign particles; careless handling</text><rect x="10" y="432" width="880" height="40" fill="#f5f7f9"/><text x="20" y="457" font-size="14" font-weight="bold" fill="#1a1a1a">Burning</text><text x="170" y="457" font-size="14"  fill="#1a1a1a">Surface damage shown by discolouration</text><text x="480" y="457" font-size="14"  fill="#1a1a1a">Excessive heat</text></svg>