<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Typical propeller blade positions, feather to reverse</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Typical propeller blade angle ranges</text>
  <!-- axis: x = 130 + (deg + 10) * 5 ; -10 deg at 130, 90 deg at 630 -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="130" y1="40" x2="130" y2="270"/>
    <line x1="180" y1="40" x2="180" y2="270" stroke="#666666" stroke-dasharray="4 3"/>
    <line x1="230" y1="40" x2="230" y2="270"/>
    <line x1="280" y1="40" x2="280" y2="270"/>
    <line x1="330" y1="40" x2="330" y2="270"/>
    <line x1="380" y1="40" x2="380" y2="270"/>
    <line x1="430" y1="40" x2="430" y2="270"/>
    <line x1="480" y1="40" x2="480" y2="270"/>
    <line x1="530" y1="40" x2="530" y2="270"/>
    <line x1="580" y1="40" x2="580" y2="270"/>
    <line x1="630" y1="40" x2="630" y2="270"/>
  </g>
  <line x1="130" y1="270" x2="630" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <g fill="#1a1a1a" text-anchor="middle" font-size="12">
    <text x="130" y="287">−10°</text><text x="180" y="287">0°</text><text x="230" y="287">10°</text>
    <text x="280" y="287">20°</text><text x="330" y="287">30°</text><text x="380" y="287">40°</text>
    <text x="430" y="287">50°</text><text x="480" y="287">60°</text><text x="530" y="287">70°</text>
    <text x="580" y="287">80°</text><text x="630" y="287">90°</text>
  </g>
  <text x="380" y="306" text-anchor="middle" font-size="12" fill="#1a1a1a">Blade angle</text>
  <g font-size="13" fill="#1a1a1a" text-anchor="end">
    <text x="120" y="62">Feather</text>
    <text x="120" y="100">Power</text>
    <text x="120" y="138">Flight idle</text>
    <text x="120" y="176">Locks</text>
    <text x="120" y="214">Ground idle</text>
    <text x="120" y="252">Reverse</text>
  </g>
  <!-- bars -->
  <rect x="605" y="48" width="25" height="20" fill="#1f5fa8"/>
  <text x="600" y="63" text-anchor="end" fill="#1a1a1a" font-size="12">85 to 90°</text>
  <rect x="280" y="86" width="75" height="20" fill="#1f5fa8"/>
  <text x="275" y="101" text-anchor="end" fill="#1a1a1a" font-size="12">20 to 35°</text>
  <rect x="230" y="124" width="10" height="20" fill="#1f5fa8"/>
  <text x="246" y="139" fill="#1a1a1a" font-size="12">10 to 12°</text>
  <rect x="185" y="162" width="5" height="20" fill="#1f5fa8"/>
  <text x="196" y="177" fill="#1a1a1a" font-size="12">1 to 2°</text>
  <rect x="178" y="200" width="4" height="20" fill="#1f5fa8"/>
  <text x="188" y="215" fill="#1a1a1a" font-size="12">0°</text>
  <rect x="140" y="238" width="30" height="20" fill="#b3261e"/>
  <text x="176" y="253" fill="#1a1a1a" font-size="12">−2 to −8°</text>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#444444">Normal travel: feather, high pitch, low pitch, locks/ground idle, reverse, then back the same way.</text>
</svg>
