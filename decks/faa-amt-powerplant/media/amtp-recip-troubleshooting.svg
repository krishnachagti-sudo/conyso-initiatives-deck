<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a"><rect width="820" height="340" fill="#ffffff"/><rect x="10" y="10" width="800" height="32" fill="#dde3ea"/><text x="18" y="30" font-weight="700">Trouble</text><text x="248" y="30" font-weight="700">Probable cause</text><text x="548" y="30" font-weight="700">Remedy</text><rect x="10" y="42" width="800" height="48" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="42" x2="240" y2="90" stroke="#8a96a3"/><line x1="540" y1="42" x2="540" y2="90" stroke="#8a96a3"/><text x="18" y="62" font-weight="400">Engine fails to start</text><text x="248" y="62" font-weight="400">Overpriming</text><text x="548" y="62" font-weight="400">Open throttle and “unload” engine by</text><text x="548" y="79" font-weight="400">rotating the propeller</text><rect x="10" y="90" width="800" height="48" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="90" x2="240" y2="138" stroke="#8a96a3"/><line x1="540" y1="90" x2="540" y2="138" stroke="#8a96a3"/><text x="18" y="110" font-weight="400">Engine fails to start</text><text x="248" y="110" font-weight="400">Defective spark plugs</text><text x="548" y="110" font-weight="400">Clean and re-gap or replace spark</text><text x="548" y="127" font-weight="400">plugs</text><rect x="10" y="138" width="800" height="31" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="138" x2="240" y2="169" stroke="#8a96a3"/><line x1="540" y1="138" x2="540" y2="169" stroke="#8a96a3"/><text x="18" y="158" font-weight="400">Engine fails to idle properly</text><text x="248" y="158" font-weight="400">Incorrect idle mixture</text><text x="548" y="158" font-weight="400">Adjust mixture</text><rect x="10" y="169" width="800" height="65" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="169" x2="240" y2="234" stroke="#8a96a3"/><line x1="540" y1="169" x2="540" y2="234" stroke="#8a96a3"/><text x="18" y="189" font-weight="400">Low power and engine running</text><text x="18" y="206" font-weight="400">uneven</text><text x="248" y="189" font-weight="400">Mixture too rich; indicated by sluggish</text><text x="248" y="206" font-weight="400">engine operation, red exhaust flame, and</text><text x="248" y="223" font-weight="400">black smoke</text><text x="548" y="189" font-weight="400">Check primer. Re-adjust carburettor</text><text x="548" y="206" font-weight="400">mixture</text><rect x="10" y="234" width="800" height="48" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="234" x2="240" y2="282" stroke="#8a96a3"/><line x1="540" y1="234" x2="540" y2="282" stroke="#8a96a3"/><text x="18" y="254" font-weight="400">Low power and engine running</text><text x="18" y="271" font-weight="400">uneven</text><text x="248" y="254" font-weight="400">Mixture too lean; indicated by</text><text x="248" y="271" font-weight="400">overheating or backfiring</text><text x="548" y="254" font-weight="400">Check fuel lines for dirt or other</text><text x="548" y="271" font-weight="400">restrictions. Check fuel supply</text><rect x="10" y="282" width="800" height="48" fill="#ffffff" stroke="#8a96a3"/><line x1="240" y1="282" x2="240" y2="330" stroke="#8a96a3"/><line x1="540" y1="282" x2="540" y2="330" stroke="#8a96a3"/><text x="18" y="302" font-weight="400">Low power and engine running</text><text x="18" y="319" font-weight="400">uneven</text><text x="248" y="302" font-weight="400">Incorrect valve clearance</text><text x="548" y="302" font-weight="400">Adjust valve clearance</text></svg>