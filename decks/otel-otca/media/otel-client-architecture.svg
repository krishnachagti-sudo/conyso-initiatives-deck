<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>OpenTelemetry client architecture</title>
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">OpenTelemetry client: organised into signals</text>
  <g fill="#1a1a1a" font-weight="bold" text-anchor="middle">
    <text x="190" y="62">Tracing</text>
    <text x="360" y="62">Metrics</text>
    <text x="530" y="62">Baggage</text>
  </g>
  <g font-size="13" fill="#1a1a1a">
    <text x="20" y="100">API</text>
    <text x="20" y="150">SDK</text>
    <text x="20" y="200">Semantic</text>
    <text x="20" y="216">Conventions</text>
    <text x="20" y="250">Contrib</text>
  </g>
  <g fill="#e8eef8" stroke="#3a5a8c" stroke-width="1.5">
    <rect x="120" y="80" width="140" height="34" rx="4"/>
    <rect x="290" y="80" width="140" height="34" rx="4"/>
    <rect x="460" y="80" width="140" height="34" rx="4"/>
  </g>
  <g fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.5">
    <rect x="120" y="130" width="140" height="34" rx="4"/>
    <rect x="290" y="130" width="140" height="34" rx="4"/>
    <rect x="460" y="130" width="140" height="34" rx="4"/>
  </g>
  <g fill="#f8f1e4" stroke="#8c6a2a" stroke-width="1.5">
    <rect x="120" y="180" width="140" height="44" rx="4"/>
    <rect x="290" y="180" width="140" height="44" rx="4"/>
    <rect x="460" y="180" width="140" height="44" rx="4"/>
  </g>
  <g fill="#f3eaf5" stroke="#6e4a7a" stroke-width="1.5">
    <rect x="120" y="234" width="140" height="34" rx="4"/>
    <rect x="290" y="234" width="140" height="34" rx="4"/>
    <rect x="460" y="234" width="140" height="34" rx="4"/>
  </g>
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <text x="190" y="102">cross-cutting</text>
    <text x="360" y="102">cross-cutting</text>
    <text x="530" y="102">cross-cutting</text>
    <text x="190" y="152">implements the API</text>
    <text x="360" y="152">implements the API</text>
    <text x="530" y="152">implements the API</text>
  </g>
  <rect x="120" y="290" width="480" height="36" rx="4" fill="#e6e6e6" stroke="#555555" stroke-width="1.5"/>
  <text x="360" y="313" text-anchor="middle" fill="#1a1a1a">Context propagation: a common subsystem shared by all signals</text>
  <text x="320" y="356" text-anchor="middle" font-size="12" fill="#333333">Signals share context propagation but function independently from each other.</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#555555">Each signal consists of four types of packages: API, SDK, Semantic Conventions and Contrib.</text>
</svg>
