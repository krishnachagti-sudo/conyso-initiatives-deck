<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"><title>Little's Law with its five assumptions grouped</title><rect width="640" height="360" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000" stroke="none"><text x="320" y="32" font-size="16" text-anchor="middle" font-weight="bold">Little’s Law (throughput form)</text><rect x="110" y="50" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="320" y="88" font-size="13" text-anchor="middle" font-weight="bold">Average Cycle Time = Average WIP ÷ Average Throughput</text><text x="320" y="130" font-size="12" text-anchor="middle" font-weight="normal">A relationship of averages, true of a past period when these assumptions hold:</text><rect x="20" y="150" width="180" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="110" y="172" font-size="13" text-anchor="middle" font-weight="bold">Conservation of Flow</text><text x="30" y="198" font-size="12" xml:space="preserve">1. Average arrival rate equals</text><text x="30" y="218" font-size="12" xml:space="preserve">    average throughput</text><text x="30" y="238" font-size="12" xml:space="preserve">2. All started work finishes</text><text x="30" y="258" font-size="12" xml:space="preserve">    and leaves the system</text><rect x="230" y="150" width="180" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="320" y="172" font-size="13" text-anchor="middle" font-weight="bold">System stability</text><text x="240" y="198" font-size="12" xml:space="preserve">3. WIP about the same at the</text><text x="240" y="218" font-size="12" xml:space="preserve">    start and end of the period</text><text x="240" y="238" font-size="12" xml:space="preserve">4. Average age of WIP neither</text><text x="240" y="258" font-size="12" xml:space="preserve">    rising nor falling</text><rect x="440" y="150" width="180" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="530" y="172" font-size="13" text-anchor="middle" font-weight="bold">Units</text><text x="450" y="198" font-size="12" xml:space="preserve">5. Cycle Time, WIP and</text><text x="450" y="218" font-size="12" xml:space="preserve">    Throughput measured in</text><text x="450" y="238" font-size="12" xml:space="preserve">    consistent units</text><text x="320" y="335" font-size="12" text-anchor="middle" font-weight="normal">Looks backward only: not a tool for deterministic forecasts.</text></g></svg>
