<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img"><title>Three example ways to represent WIP control on a Kanban board</title><rect width="700" height="300" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000" stroke="none"><text x="20" y="22" font-size="14" text-anchor="start" font-weight="bold">Some ways to show WIP control (examples, not rules)</text><text x="110" y="60" font-size="12" text-anchor="middle" font-weight="bold">1. A limit on some columns</text><rect x="30" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="49.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Ready</text><rect x="72" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="91.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Build</text><text x="91.0" y="220" font-size="10" text-anchor="middle" font-weight="bold">limit 3</text><rect x="114" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="133.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Test</text><text x="133.0" y="220" font-size="10" text-anchor="middle" font-weight="bold">limit 3</text><rect x="156" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="175.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Done</text><text x="340" y="60" font-size="12" text-anchor="middle" font-weight="bold">2. One limit for the board</text><rect x="260" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="279.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Ready</text><rect x="302" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="321.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Build</text><rect x="344" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="363.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Test</text><rect x="386" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="405.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Done</text><rect x="256" y="80" width="172" height="132" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="6 3"/><text x="340" y="225" font-size="9" text-anchor="middle" font-weight="bold">one limit: 6 items on the whole board</text><text x="570" y="60" font-size="12" text-anchor="middle" font-weight="bold">3. One limit for grouped columns</text><rect x="490" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="509.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Ready</text><rect x="532" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="551.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Build</text><rect x="574" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="593.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Test</text><rect x="616" y="86" width="38" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="635.0" y="100" font-size="9" text-anchor="middle" font-weight="normal">Done</text><rect x="530" y="80" width="86" height="132" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="6 3"/><text x="570" y="225" font-size="9" text-anchor="middle" font-weight="bold">one shared limit: 4 across Build + Test</text><text x="20" y="280" font-size="12" text-anchor="start" font-weight="normal">The Guide requires WIP to be controlled, and lets members represent that control in any way.</text></g></svg>
