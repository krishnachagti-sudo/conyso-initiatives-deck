<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"><title>Two illustrative cumulative flow diagrams: stable and diverging</title><rect width="720" height="380" fill="#fff"/><g font-family="Helvetica, Arial, sans-serif" fill="#000" stroke="none"><text x="20" y="22" font-size="14" text-anchor="start" font-weight="bold">Cumulative flow diagrams — ILLUSTRATIVE DATA</text><line x1="50" y1="320" x2="330" y2="320" stroke="#000" stroke-width="2"/><line x1="50" y1="320" x2="50" y2="60" stroke="#000" stroke-width="2"/><line x1="46" y1="320.0" x2="50" y2="320.0" stroke="#000" stroke-width="1.5"/><text x="43" y="324.0" font-size="11" text-anchor="end" font-weight="normal">0</text><line x1="46" y1="255.0" x2="50" y2="255.0" stroke="#000" stroke-width="1.5"/><text x="43" y="259.0" font-size="11" text-anchor="end" font-weight="normal">10</text><line x1="46" y1="190.0" x2="50" y2="190.0" stroke="#000" stroke-width="1.5"/><text x="43" y="194.0" font-size="11" text-anchor="end" font-weight="normal">20</text><line x1="46" y1="125.0" x2="50" y2="125.0" stroke="#000" stroke-width="1.5"/><text x="43" y="129.0" font-size="11" text-anchor="end" font-weight="normal">30</text><line x1="46" y1="60.0" x2="50" y2="60.0" stroke="#000" stroke-width="1.5"/><text x="43" y="64.0" font-size="11" text-anchor="end" font-weight="normal">40</text><polygon points="50.0,294.0 90.0,268.0 130.0,242.0 170.0,216.0 210.0,190.0 250.0,164.0 290.0,138.0 330.0,112.0 330.0,138.0 290.0,164.0 250.0,190.0 210.0,216.0 170.0,242.0 130.0,268.0 90.0,294.0 50.0,320.0" fill="#ddd" stroke="none"/><polyline points="50.0,294.0 90.0,268.0 130.0,242.0 170.0,216.0 210.0,190.0 250.0,164.0 290.0,138.0 330.0,112.0" fill="none" stroke="#000" stroke-width="2.5"/><polyline points="50.0,320.0 90.0,294.0 130.0,268.0 170.0,242.0 210.0,216.0 250.0,190.0 290.0,164.0 330.0,138.0" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 4"/><text x="190.0" y="36" font-size="13" text-anchor="middle" font-weight="bold">A: lines roughly parallel</text><text x="190.0" y="350" font-size="12" text-anchor="middle" font-weight="normal">Time (weeks) →</text><text x="16" y="190.0" font-size="12" text-anchor="middle" transform="rotate(-90 16 190.0)">Cumulative count of items</text><text x="130.0" y="232.0" font-size="11" text-anchor="end" font-weight="normal">arrivals (started)</text><text x="216.0" y="234.0" font-size="11" text-anchor="start" font-weight="normal">departures (finished)</text><line x1="410" y1="320" x2="690" y2="320" stroke="#000" stroke-width="2"/><line x1="410" y1="320" x2="410" y2="60" stroke="#000" stroke-width="2"/><line x1="406" y1="320.0" x2="410" y2="320.0" stroke="#000" stroke-width="1.5"/><text x="403" y="324.0" font-size="11" text-anchor="end" font-weight="normal">0</text><line x1="406" y1="255.0" x2="410" y2="255.0" stroke="#000" stroke-width="1.5"/><text x="403" y="259.0" font-size="11" text-anchor="end" font-weight="normal">10</text><line x1="406" y1="190.0" x2="410" y2="190.0" stroke="#000" stroke-width="1.5"/><text x="403" y="194.0" font-size="11" text-anchor="end" font-weight="normal">20</text><line x1="406" y1="125.0" x2="410" y2="125.0" stroke="#000" stroke-width="1.5"/><text x="403" y="129.0" font-size="11" text-anchor="end" font-weight="normal">30</text><line x1="406" y1="60.0" x2="410" y2="60.0" stroke="#000" stroke-width="1.5"/><text x="403" y="64.0" font-size="11" text-anchor="end" font-weight="normal">40</text><polygon points="410.0,294.0 450.0,261.5 490.0,229.0 530.0,196.5 570.0,164.0 610.0,131.5 650.0,99.0 690.0,66.5 690.0,216.0 650.0,229.0 610.0,242.0 570.0,255.0 530.0,268.0 490.0,281.0 450.0,300.5 410.0,320.0" fill="#ddd" stroke="none"/><polyline points="410.0,294.0 450.0,261.5 490.0,229.0 530.0,196.5 570.0,164.0 610.0,131.5 650.0,99.0 690.0,66.5" fill="none" stroke="#000" stroke-width="2.5"/><polyline points="410.0,320.0 450.0,300.5 490.0,281.0 530.0,268.0 570.0,255.0 610.0,242.0 650.0,229.0 690.0,216.0" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 4"/><text x="550.0" y="36" font-size="13" text-anchor="middle" font-weight="bold">B: lines diverging</text><text x="550.0" y="350" font-size="12" text-anchor="middle" font-weight="normal">Time (weeks) →</text><text x="376" y="190.0" font-size="12" text-anchor="middle" transform="rotate(-90 376 190.0)">Cumulative count of items</text><text x="490.0" y="219.0" font-size="11" text-anchor="end" font-weight="normal">arrivals (started)</text><text x="576.0" y="273.0" font-size="11" text-anchor="start" font-weight="normal">departures (finished)</text><text x="20" y="372" font-size="12" text-anchor="start" font-weight="normal">Shaded band = items started but not finished. Solid line = arrivals; dashed line = departures.</text></g></svg>
