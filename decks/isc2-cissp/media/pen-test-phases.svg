<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <title>Four-stage penetration testing methodology</title>
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="150" height="56" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="95" y="104" text-anchor="middle" fill="#1a1a1a">Planning</text>
  <rect x="245" y="70" width="150" height="56" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="320" y="104" text-anchor="middle" fill="#1a1a1a">Discovery</text>
  <rect x="470" y="70" width="150" height="56" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="545" y="104" text-anchor="middle" fill="#1a1a1a">Attack</text>
  <line x1="170" y1="98" x2="243" y2="98" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="395" y1="98" x2="468" y2="98" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <path d="M545,70 C545,25 320,25 320,68" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="432" y="30" text-anchor="middle" font-size="14" fill="#1a1a1a">Additional discovery</text>
  <rect x="20" y="170" width="600" height="50" rx="8" fill="#f3efe6" stroke="#7a5c1e" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" fill="#1a1a1a">Reporting (runs alongside the other three phases)</text>
  <line x1="95" y1="126" x2="95" y2="168" stroke="#7a5c1e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="320" y1="126" x2="320" y2="168" stroke="#7a5c1e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="545" y1="126" x2="545" y2="168" stroke="#7a5c1e" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
