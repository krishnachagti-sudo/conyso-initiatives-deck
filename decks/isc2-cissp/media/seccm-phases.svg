<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Four phases of security-focused configuration management</title>
  <rect width="700" height="240" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="15" y="60" width="140" height="70" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" fill="#1a1a1a">Planning</text>
  <rect x="190" y="60" width="140" height="70" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="260" y="90" text-anchor="middle" fill="#1a1a1a">Identifying and</text>
  <text x="260" y="108" text-anchor="middle" fill="#1a1a1a">implementing</text>
  <text x="260" y="126" text-anchor="middle" fill="#1a1a1a" font-size="14">configurations</text>
  <rect x="365" y="60" width="140" height="70" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="435" y="90" text-anchor="middle" fill="#1a1a1a">Controlling</text>
  <text x="435" y="108" text-anchor="middle" fill="#1a1a1a">configuration</text>
  <text x="435" y="126" text-anchor="middle" fill="#1a1a1a" font-size="14">changes</text>
  <rect x="540" y="60" width="140" height="70" rx="8" fill="#e8eef7" stroke="#2f4f7f" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" fill="#1a1a1a">Monitoring</text>
  <line x1="155" y1="95" x2="188" y2="95" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="95" x2="363" y2="95" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="95" x2="538" y2="95" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <path d="M610,130 C610,215 85,215 85,132" fill="none" stroke="#7a5c1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="260" y1="200" x2="260" y2="132" stroke="#7a5c1e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="435" y1="200" x2="435" y2="132" stroke="#7a5c1e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="350" y="232" text-anchor="middle" font-size="14" fill="#1a1a1a">Monitoring may loop back to any earlier phase</text>
</svg>
