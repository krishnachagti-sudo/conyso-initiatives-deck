<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Istio architecture in sidecar mode</title>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <!-- Control plane -->
  <rect x="20" y="20" width="600" height="100" rx="8" fill="#eef3fb" stroke="#3b5b8c" stroke-width="2"/>
  <text x="36" y="44" font-weight="bold" fill="#1f3558">Control plane</text>
  <rect x="230" y="50" width="180" height="54" rx="6" fill="#ffffff" stroke="#3b5b8c" stroke-width="2"/>
  <text x="320" y="74" text-anchor="middle" font-weight="bold" fill="#1f3558">istiod</text>
  <text x="320" y="93" text-anchor="middle" font-size="11" fill="#1f3558">discovery · configuration · certificates</text>
  <!-- Data plane -->
  <rect x="20" y="160" width="600" height="220" rx="8" fill="#f4f8ef" stroke="#4d7a2e" stroke-width="2"/>
  <text x="36" y="184" font-weight="bold" fill="#2d4d17">Data plane</text>
  <!-- Pod A -->
  <rect x="50" y="200" width="220" height="150" rx="6" fill="#ffffff" stroke="#4d7a2e" stroke-width="2"/>
  <text x="160" y="222" text-anchor="middle" fill="#2d4d17">Pod</text>
  <rect x="70" y="235" width="180" height="40" rx="4" fill="#fafafa" stroke="#777"/>
  <text x="160" y="260" text-anchor="middle" fill="#333">Service A</text>
  <rect x="70" y="290" width="180" height="40" rx="4" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
  <text x="160" y="315" text-anchor="middle" fill="#6b3f00">Envoy proxy (sidecar)</text>
  <!-- Pod B -->
  <rect x="370" y="200" width="220" height="150" rx="6" fill="#ffffff" stroke="#4d7a2e" stroke-width="2"/>
  <text x="480" y="222" text-anchor="middle" fill="#2d4d17">Pod</text>
  <rect x="390" y="235" width="180" height="40" rx="4" fill="#fafafa" stroke="#777"/>
  <text x="480" y="260" text-anchor="middle" fill="#333">Service B</text>
  <rect x="390" y="290" width="180" height="40" rx="4" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
  <text x="480" y="315" text-anchor="middle" fill="#6b3f00">Envoy proxy (sidecar)</text>
  <!-- Mesh traffic -->
  <line x1="250" y1="310" x2="386" y2="310" stroke="#b36b00" stroke-width="3" marker-end="url(#arrowT)"/>
  <text x="318" y="302" text-anchor="middle" font-size="11" fill="#6b3f00">mesh traffic</text>
  <!-- Config lines -->
  <line x1="280" y1="104" x2="170" y2="288" stroke="#3b5b8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowC)"/>
  <line x1="360" y1="104" x2="470" y2="288" stroke="#3b5b8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowC)"/>
  <text x="320" y="146" text-anchor="middle" font-size="11" fill="#1f3558">configuration pushed to the proxies</text>
  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b36b00"/></marker>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5b8c"/></marker>
  </defs>
</svg>
