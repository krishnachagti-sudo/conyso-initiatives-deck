<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="620" height="380" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">180-degree power-off approach (plan view)</text>
  <rect x="120" y="290" width="440" height="34" fill="#dddddd" stroke="#555"/>
  <text x="340" y="345" text-anchor="middle" fill="#222">Runway (landing to the right)</text>
  <line x1="300" y1="286" x2="300" y2="328" stroke="#c00000" stroke-width="3"/>
  <text x="300" y="365" text-anchor="middle" fill="#c00000" font-weight="bold">Selected landing spot</text>
  <rect x="300" y="292" width="40" height="30" fill="#f4c7c3" stroke="none" opacity="0.8"/>
  <text x="400" y="312" fill="#222">touchdown on the spot or</text>
  <text x="400" y="326" fill="#222">within 200 ft beyond it</text>
  <path d="M 540 110 L 300 110 L 140 110 C 70 110, 60 190, 90 240 C 110 280, 150 307, 200 307 L 300 307" fill="none" stroke="#0b4f8a" stroke-width="3"/>
  <polygon points="540,110 525,103 525,117" fill="#0b4f8a" transform="rotate(180 532 110)"/>
  <text x="460" y="100" fill="#0b4f8a" font-weight="bold">Downwind leg, parallel to the runway</text>
  <circle cx="300" cy="110" r="6" fill="#c00000"/>
  <line x1="300" y1="118" x2="300" y2="282" stroke="#c00000" stroke-dasharray="4,4"/>
  <text x="300" y="68" text-anchor="middle" fill="#c00000" font-weight="bold">Downwind key position:</text>
  <text x="300" y="84" text-anchor="middle" fill="#c00000">abeam the spot, throttle closed</text>
  <circle cx="72" cy="185" r="6" fill="#0b4f8a"/>
  <text x="84" y="170" fill="#0b4f8a" font-weight="bold">Base key position</text>
  <text x="84" y="186" fill="#0b4f8a">(not a fixed landmark)</text>
  <text x="310" y="210" text-anchor="middle" fill="#555">Glide at idle from the downwind key position through base to the spot;</text>
  <text x="310" y="226" text-anchor="middle" fill="#555">position the base leg to conserve or dissipate altitude.</text>
</svg>
