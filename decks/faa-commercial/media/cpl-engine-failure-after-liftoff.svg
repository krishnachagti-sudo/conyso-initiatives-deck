<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="600" height="330" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Engine failure shortly after lift-off: the decision</text>
  <rect x="170" y="40" width="260" height="40" rx="6" fill="#eef3f9" stroke="#0b4f8a" stroke-width="2"/>
  <text x="300" y="65" text-anchor="middle" fill="#222">One engine fails shortly after lift-off</text>
  <line x1="300" y1="80" x2="300" y2="105" stroke="#222" stroke-width="2"/>
  <rect x="90" y="105" width="420" height="58" rx="6" fill="#fff5e6" stroke="#b35900" stroke-width="2"/>
  <text x="300" y="129" text-anchor="middle" fill="#222">Is single-engine climb performance adequate,</text>
  <text x="300" y="148" text-anchor="middle" fill="#222">with the airplane promptly and correctly configured?</text>
  <line x1="200" y1="163" x2="140" y2="205" stroke="#222" stroke-width="2"/><line x1="400" y1="163" x2="460" y2="205" stroke="#222" stroke-width="2"/>
  <text x="155" y="188" fill="#222" font-weight="bold">Yes</text><text x="430" y="188" fill="#222" font-weight="bold">No: climb unlikely</text>
  <rect x="30" y="205" width="230" height="50" rx="6" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="145" y="235" text-anchor="middle" fill="#222">The climb may be continued</text>
  <rect x="330" y="205" width="250" height="50" rx="6" fill="#fdecea" stroke="#c00000" stroke-width="2"/>
  <text x="455" y="226" text-anchor="middle" fill="#222">Land in the most suitable area,</text>
  <text x="455" y="244" text-anchor="middle" fill="#222">even off-airport</text>
  <text x="300" y="292" text-anchor="middle" fill="#c00000" font-weight="bold">To be avoided above all: continuing flight</text>
  <text x="300" y="310" text-anchor="middle" fill="#c00000" font-weight="bold">beyond the airplane's performance capability.</text>
</svg>
