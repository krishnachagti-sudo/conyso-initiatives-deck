<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Times of useful consciousness versus altitude</text>
  <rect x="40" y="40" width="480" height="32" fill="#0b4f8a"/>
  <g fill="#ffffff" font-weight="bold"><text x="60" y="61">Altitude (ft)</text><text x="220" y="61">TUC/EPT</text><text x="350" y="61">After rapid decompression</text></g>
  <g fill="#222">
    <rect x="40" y="72" width="480" height="32" fill="#eef3f9"/><text x="60" y="93">18,000</text><text x="220" y="93">20–30 min</text><text x="350" y="93">10–15 min</text>
    <text x="60" y="125">22,000</text><text x="220" y="125">10 min</text><text x="350" y="125">5–6 min</text>
    <rect x="40" y="136" width="480" height="32" fill="#eef3f9"/><text x="60" y="157">25,000</text><text x="220" y="157">3–5 min</text><text x="350" y="157">1.5–2.5 min</text>
    <text x="60" y="189">28,000</text><text x="220" y="189">2.5–3 min</text><text x="350" y="189">1–1.5 min</text>
    <rect x="40" y="200" width="480" height="32" fill="#eef3f9"/><text x="60" y="221">30,000</text><text x="220" y="221">1–2 min</text><text x="350" y="221">30 s–1 min</text>
    <text x="60" y="253">35,000</text><text x="220" y="253">30 s–1 min</text><text x="350" y="253">15–30 s</text>
    <rect x="40" y="264" width="480" height="32" fill="#eef3f9"/><text x="60" y="285">40,000</text><text x="220" y="285">15–20 s</text><text x="350" y="285">Nominal</text>
    <text x="60" y="317">43,000</text><text x="220" y="317">9–12 s</text><text x="350" y="317">Nominal</text>
    <rect x="40" y="328" width="480" height="32" fill="#eef3f9"/><text x="60" y="349">50,000</text><text x="220" y="349">9–12 s</text><text x="350" y="349">Nominal</text>
  </g>
  <text x="280" y="385" text-anchor="middle" font-size="12" fill="#555">Average values; individuals vary widely. Assume the lower value is limiting.</text>
</svg>
