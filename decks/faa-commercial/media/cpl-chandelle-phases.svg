<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="600" height="380" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Chandelle: bank and pitch through the 180° of turn</text>
  <g stroke="#d0d0d0" stroke-width="1">
    <line x1="80" y1="60" x2="540" y2="60"/><line x1="80" y1="140" x2="540" y2="140"/><line x1="80" y1="220" x2="540" y2="220"/>
    <line x1="310" y1="50" x2="310" y2="300" stroke-dasharray="5,4" stroke="#888"/>
  </g>
  <g stroke="#222" stroke-width="1.5"><line x1="80" y1="300" x2="540" y2="300"/><line x1="80" y1="50" x2="80" y2="300"/></g>
  <text x="80" y="320" text-anchor="middle" fill="#222">0°</text>
  <text x="310" y="320" text-anchor="middle" fill="#222">90°</text>
  <text x="540" y="320" text-anchor="middle" fill="#222">180°</text>
  <text x="310" y="342" text-anchor="middle" fill="#222">Degrees of turn completed</text>
  <polyline points="80,300 110,140 310,140 540,300" fill="none" stroke="#0b4f8a" stroke-width="3"/>
  <polyline points="80,300 310,70 540,70" fill="none" stroke="#b35900" stroke-width="3" stroke-dasharray="9,5"/>
  <text x="200" y="132" text-anchor="middle" fill="#0b4f8a" font-weight="bold">Bank constant (about 30°)</text>
  <text x="430" y="200" text-anchor="middle" fill="#0b4f8a" font-weight="bold">Bank decreasing</text>
  <text x="430" y="216" text-anchor="middle" fill="#0b4f8a">(wings level at 180°)</text>
  <text x="180" y="230" text-anchor="middle" fill="#b35900" font-weight="bold">Pitch increasing</text>
  <text x="430" y="62" text-anchor="middle" fill="#b35900" font-weight="bold">Pitch held constant</text>
  <text x="195" y="290" text-anchor="middle" fill="#222">First 90°</text>
  <text x="425" y="290" text-anchor="middle" fill="#222">Second 90°</text>
  <text x="300" y="366" text-anchor="middle" fill="#222">Airspeed falls throughout and ends just above the power-on stall speed.</text>
  <g font-size="12"><line x1="90" y1="44" x2="115" y2="44" stroke="#0b4f8a" stroke-width="3"/><text x="120" y="48" fill="#222">bank</text>
  <line x1="170" y1="44" x2="195" y2="44" stroke="#b35900" stroke-width="3" stroke-dasharray="9,5"/><text x="200" y="48" fill="#222">pitch</text></g>
</svg>
