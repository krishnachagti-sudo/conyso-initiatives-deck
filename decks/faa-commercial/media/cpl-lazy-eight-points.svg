<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Lazy eight: one 180° half and its reference points</text>
  <line x1="60" y1="160" x2="600" y2="160" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="152" text-anchor="end" fill="#555">level pitch</text>
  <path d="M 60 160 C 120 70, 140 70, 195 75 C 250 80, 290 130, 330 160 C 370 190, 410 250, 465 245 C 520 240, 560 190, 600 160" fill="none" stroke="#b35900" stroke-width="3"/>
  <text x="130" y="60" fill="#b35900" font-weight="bold">climb</text>
  <text x="470" y="270" fill="#b35900" font-weight="bold">descent</text>
  <g fill="#0b4f8a"><circle cx="60" cy="160" r="5"/><circle cx="195" cy="75" r="5"/><circle cx="330" cy="160" r="5"/><circle cx="465" cy="245" r="5"/><circle cx="600" cy="160" r="5"/></g>
  <g text-anchor="middle" fill="#222" font-weight="bold" font-size="13">
    <text x="60" y="300">0°</text><text x="195" y="300">45°</text><text x="330" y="300">90°</text><text x="465" y="300">135°</text><text x="600" y="300">180°</text>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="60" y="318">Level flight,</text><text x="60" y="333">entry airspeed</text>
    <text x="195" y="318">Maximum pitch up,</text><text x="195" y="333">bank about 15°</text>
    <text x="330" y="318">Pitch through level,</text><text x="330" y="333">bank about 30° (max),</text><text x="330" y="348">airspeed at minimum,</text><text x="330" y="363">5–10 knots above stall</text>
    <text x="465" y="318">Lowest pitch</text><text x="465" y="333">attitude</text>
    <text x="562" y="318">Wings and nose level,</text><text x="562" y="333">original airspeed</text>
  </g>
  <text x="320" y="392" text-anchor="middle" fill="#555">The second half repeats the pattern turning the other way. Curve: pitch attitude (schematic).</text>
</svg>
