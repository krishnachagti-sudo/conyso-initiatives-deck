<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Control positions for taxiing a nosewheel airplane in a quartering headwind and a quartering tailwind">
<rect width="560" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111111">
<text x="140" y="28" font-size="17" font-weight="bold" text-anchor="middle">Quartering headwind</text>
<text x="420" y="28" font-size="17" font-weight="bold" text-anchor="middle">Quartering tailwind</text>
<line x1="280" y1="15" x2="280" y2="285" stroke="#bbbbbb"/>
<g transform="translate(140,150)">
<path d="M0,-70 L8,-40 L8,40 L0,55 L-8,40 L-8,-40 Z" fill="#dddddd" stroke="#333333"/>
<rect x="-90" y="-22" width="180" height="18" fill="#dddddd" stroke="#333333"/>
<rect x="-30" y="38" width="60" height="10" fill="#dddddd" stroke="#333333"/>
</g>
<g stroke="#1f4e9c" stroke-width="4" fill="#1f4e9c"><line x1="20" y1="60" x2="55" y2="95"/><polygon points="62,102 48,98 58,88"/></g>
<text x="18" y="52" font-size="14" fill="#1f4e9c">Wind</text>
<text x="20" y="220" font-size="14">Upwind aileron UP</text>
<text x="20" y="240" font-size="14">(nosewheel type: elevator neutral)</text>
<g transform="translate(420,150)">
<path d="M0,-70 L8,-40 L8,40 L0,55 L-8,40 L-8,-40 Z" fill="#dddddd" stroke="#333333"/>
<rect x="-90" y="-22" width="180" height="18" fill="#dddddd" stroke="#333333"/>
<rect x="-30" y="38" width="60" height="10" fill="#dddddd" stroke="#333333"/>
</g>
<g stroke="#1f4e9c" stroke-width="4" fill="#1f4e9c"><line x1="300" y1="270" x2="335" y2="235"/><polygon points="342,228 338,242 328,232"/></g>
<text x="300" y="290" font-size="14" fill="#1f4e9c">Wind</text>
<text x="300" y="220" font-size="14">Elevator DOWN</text>
<text x="300" y="240" font-size="14">Upwind aileron DOWN</text>
<text x="280" y="298" font-size="11" fill="#555555" text-anchor="middle"> </text>
</g>
</svg>
