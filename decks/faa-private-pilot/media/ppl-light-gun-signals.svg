<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Table of ATC light gun signals and their meanings on the surface and in flight">
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111111">
<rect x="10" y="10" width="620" height="36" fill="#e8e8e8"/>
<text x="20" y="33" font-weight="bold">Signal</text>
<text x="220" y="33" font-weight="bold">Aircraft on the surface</text>
<text x="430" y="33" font-weight="bold">Aircraft in flight</text>
<circle cx="28" cy="68" r="8" fill="#1a9c3a"/><text x="44" y="73">Steady green</text>
<text x="220" y="73">Cleared for takeoff</text><text x="430" y="73">Cleared to land</text>
<circle cx="28" cy="110" r="8" fill="none" stroke="#1a9c3a" stroke-width="4" stroke-dasharray="4 3"/><text x="44" y="115">Flashing green</text>
<text x="220" y="115">Cleared to taxi</text><text x="430" y="107">Return for landing (then</text><text x="430" y="125">steady green at proper time)</text>
<circle cx="28" cy="152" r="8" fill="#cc1f1f"/><text x="44" y="157">Steady red</text>
<text x="220" y="157">Stop</text><text x="430" y="149">Give way to other aircraft</text><text x="430" y="167">and continue circling</text>
<circle cx="28" cy="194" r="8" fill="none" stroke="#cc1f1f" stroke-width="4" stroke-dasharray="4 3"/><text x="44" y="199">Flashing red</text>
<text x="220" y="199">Taxi clear of runway in use</text><text x="430" y="199">Airport unsafe, do not land</text>
<circle cx="28" cy="236" r="8" fill="none" stroke="#777777" stroke-width="4" stroke-dasharray="4 3"/><text x="44" y="241">Flashing white</text>
<text x="220" y="233">Return to starting point</text><text x="220" y="251">on airport</text><text x="430" y="241">Not applicable</text>
<circle cx="22" cy="278" r="7" fill="#cc1f1f"/><circle cx="36" cy="278" r="7" fill="#1a9c3a"/><text x="48" y="273">Alternating</text><text x="48" y="291">red and green</text>
<text x="220" y="283">Exercise extreme caution</text><text x="430" y="283">Exercise extreme caution</text>
<g stroke="#bbbbbb" stroke-width="1"><line x1="10" y1="89" x2="630" y2="89"/><line x1="10" y1="131" x2="630" y2="131"/><line x1="10" y1="173" x2="630" y2="173"/><line x1="10" y1="215" x2="630" y2="215"/><line x1="10" y1="257" x2="630" y2="257"/><line x1="10" y1="300" x2="630" y2="300"/></g>
<text x="20" y="320" font-size="12" fill="#555555">Meanings from 14 CFR § 91.125. Dashed ring = flashing.</text>
</g>
</svg>
