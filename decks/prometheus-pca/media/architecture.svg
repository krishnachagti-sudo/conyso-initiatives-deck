<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
    .core { fill: #fff4ef; stroke: #c8502a; stroke-width: 2; }
    .part { fill: #ffffff; stroke: #c8502a; stroke-width: 1.2; }
    .t { font-size: 13px; fill: #111; text-anchor: middle; }
    .b { font-size: 14px; fill: #111; text-anchor: middle; font-weight: 600; }
    .s { font-size: 11px; fill: #444; text-anchor: middle; }
    .ln { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#555"/></marker></defs>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <!-- targets -->
  <rect x="20" y="40" width="130" height="44" rx="6" class="box"/><text x="85" y="60" class="t">short-lived jobs</text><text x="85" y="75" class="s">push metrics at exit</text>
  <rect x="20" y="130" width="130" height="40" rx="6" class="box"/><text x="85" y="155" class="t">Pushgateway</text>
  <rect x="20" y="240" width="130" height="44" rx="6" class="box"/><text x="85" y="260" class="t">jobs and exporters</text><text x="85" y="275" class="s">Prometheus targets</text>
  <line x1="85" y1="84" x2="85" y2="128" class="ln"/>

  <!-- service discovery -->
  <rect x="210" y="20" width="220" height="50" rx="6" class="box"/><text x="320" y="42" class="t">service discovery</text><text x="320" y="59" class="s">e.g. Kubernetes, file_sd</text>

  <!-- server -->
  <rect x="190" y="110" width="260" height="170" rx="8" class="core"/>
  <text x="320" y="132" class="b">Prometheus server</text>
  <rect x="205" y="150" width="70" height="40" rx="5" class="part"/><text x="240" y="175" class="t">retrieval</text>
  <rect x="285" y="150" width="70" height="40" rx="5" class="part"/><text x="320" y="175" class="t">TSDB</text>
  <rect x="365" y="150" width="70" height="40" rx="5" class="part"/><text x="400" y="169" class="t">HTTP</text><text x="400" y="183" class="t">server</text>
  <rect x="255" y="225" width="130" height="36" rx="5" fill="#eee" stroke="#555"/><text x="320" y="248" class="t">local storage</text>
  <line x1="320" y1="190" x2="320" y2="223" class="ln"/>
  <line x1="320" y1="72" x2="320" y2="108" class="ln"/><text x="360" y="95" class="s">discover targets</text>

  <!-- pulls -->
  <line x1="203" y1="165" x2="152" y2="152" class="ln"/>
  <line x1="203" y1="178" x2="152" y2="255" class="ln"/>
  <text x="172" y="208" class="s">pull</text>

  <!-- alerting -->
  <rect x="500" y="110" width="160" height="40" rx="6" class="box"/><text x="580" y="135" class="t">Alertmanager</text>
  <line x1="452" y1="140" x2="498" y2="132" class="ln"/><text x="476" y="118" class="s">alerts</text>
  <rect x="500" y="30" width="160" height="40" rx="6" class="box"/><text x="580" y="48" class="t">email, pager, chat…</text><text x="580" y="62" class="s">notifications</text>
  <line x1="580" y1="108" x2="580" y2="72" class="ln"/>

  <!-- querying -->
  <rect x="500" y="220" width="160" height="34" rx="6" class="box"/><text x="580" y="242" class="t">web UI</text>
  <rect x="500" y="262" width="160" height="34" rx="6" class="box"/><text x="580" y="284" class="t">Grafana</text>
  <rect x="500" y="304" width="160" height="34" rx="6" class="box"/><text x="580" y="326" class="t">API clients</text>
  <line x1="498" y1="237" x2="438" y2="192" class="ln"/>
  <line x1="498" y1="279" x2="440" y2="196" class="ln"/>
  <line x1="498" y1="321" x2="442" y2="198" class="ln"/>
  <text x="475" y="360" class="s">query with PromQL</text>
</svg>
