<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bar { fill: #4f7cff; }
    .barlabel { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
    .axislabel { font-size: 13px; fill: #333; text-anchor: middle; }
    .title { font-size: 15px; fill: #111; text-anchor: middle; font-weight: 600; }
    .count { font-size: 13px; fill: #111; text-anchor: middle; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="24" class="title">http_request_duration_seconds_bucket{le="..."} — cumulative counts</text>

  <!-- baseline -->
  <line x1="70" y1="300" x2="610" y2="300" stroke="#888" stroke-width="1.5"/>

  <!-- bars: le=0.1 -> 12, le=0.3 -> 30, le=1 -> 41, le=+Inf -> 45 (cumulative, each includes the ones before) -->
  <!-- bar heights scaled: max 45 -> 220px -->
  <rect x="100" y="241" width="80" height="59" class="bar" opacity="1"/>
  <text x="140" y="234" class="count">12</text>
  <text x="140" y="320" class="axislabel">le="0.1"</text>

  <rect x="220" y="153" width="80" height="147" class="bar" opacity="0.85"/>
  <text x="260" y="146" class="count">30</text>
  <text x="260" y="320" class="axislabel">le="0.3"</text>

  <rect x="340" y="100" width="80" height="200" class="bar" opacity="0.7"/>
  <text x="380" y="93" class="count">41</text>
  <text x="380" y="320" class="axislabel">le="1"</text>

  <rect x="460" y="80" width="80" height="220" class="bar" opacity="0.55"/>
  <text x="500" y="73" class="count">45</text>
  <text x="500" y="320" class="axislabel">le="+Inf"</text>

  <text x="320" y="345" class="axislabel">Each bucket's count includes every observation ≤ its own "le" boundary, so counts only grow.</text>
</svg>
