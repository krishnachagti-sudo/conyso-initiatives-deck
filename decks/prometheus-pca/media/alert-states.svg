<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #4f7cff; stroke-width: 2; }
    .boxfiring { fill: #fdeaea; stroke: #d94848; stroke-width: 2; }
    .label { font-size: 16px; fill: #111; text-anchor: middle; font-weight: 600; }
    .sub { font-size: 12px; fill: #333; text-anchor: middle; }
    .arrow { stroke: #444; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 15px; fill: #111; text-anchor: middle; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="220" fill="#ffffff"/>
  <text x="330" y="24" class="title">Alerting rule states</text>

  <rect x="20" y="70" width="140" height="70" rx="8" class="box"/>
  <text x="90" y="100" class="label">inactive</text>
  <text x="90" y="122" class="sub">expr not true</text>

  <line x1="160" y1="105" x2="258" y2="105" class="arrow"/>
  <text x="210" y="50" class="sub">expr</text><text x="210" y="64" class="sub">becomes true</text>

  <rect x="260" y="70" width="140" height="70" rx="8" class="box"/>
  <text x="330" y="100" class="label">pending</text>
  <text x="330" y="122" class="sub">waiting out "for"</text>

  <line x1="400" y1="105" x2="498" y2="105" class="arrow"/>
  <text x="450" y="50" class="sub">"for" duration</text><text x="450" y="64" class="sub">has passed</text>

  <rect x="500" y="70" width="140" height="70" rx="8" class="boxfiring"/>
  <text x="570" y="100" class="label">firing</text>
  <text x="570" y="122" class="sub">sent to Alertmanager</text>

  <path d="M 570 142 C 520 190, 150 190, 95 145" class="arrow" fill="none"/>
  <text x="330" y="205" class="sub">condition no longer met (after any keep_firing_for) → back to inactive</text>
</svg>
