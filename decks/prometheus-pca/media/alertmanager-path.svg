<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #4f7cff; stroke-width: 2; }
    .mute { fill: #f3f3f3; stroke: #888; stroke-width: 2; stroke-dasharray: 5 4; }
    .recv { fill: #eaf7ee; stroke: #3a9a5b; stroke-width: 2; }
    .label { font-size: 15px; fill: #111; text-anchor: middle; font-weight: 600; }
    .sub { font-size: 12px; fill: #333; text-anchor: middle; }
    .title { font-size: 15px; fill: #111; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #444; stroke-width: 2; marker-end: url(#a); fill: none; }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#444"/></marker></defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="24" class="title">What the Alertmanager does with the alerts it receives</text>

  <rect x="20" y="110" width="130" height="60" rx="8" class="box"/>
  <text x="85" y="136" class="label">alerts</text>
  <text x="85" y="155" class="sub">from Prometheus</text>
  <line x1="150" y1="140" x2="198" y2="140" class="arrow"/>

  <rect x="200" y="50" width="240" height="180" rx="10" fill="#ffffff" stroke="#4f7cff" stroke-width="2"/>
  <text x="320" y="74" class="label">Alertmanager</text>
  <text x="320" y="100" class="sub">deduplicates them</text>
  <text x="320" y="120" class="sub">groups similar alerts into one notification</text>
  <text x="320" y="140" class="sub">routes each group to a receiver</text>
  <text x="320" y="160" class="sub">(grouping, timing and receivers are set</text>
  <text x="320" y="176" class="sub">by the routing tree in its configuration)</text>

  <rect x="215" y="245" width="100" height="44" rx="8" class="mute"/>
  <text x="265" y="264" class="label">inhibition</text>
  <text x="265" y="281" class="sub">rule-based mute</text>
  <rect x="325" y="245" width="100" height="44" rx="8" class="mute"/>
  <text x="375" y="264" class="label">silences</text>
  <text x="375" y="281" class="sub">time-bound mute</text>
  <line x1="320" y1="245" x2="320" y2="232" stroke="#888" stroke-width="2"/>

  <line x1="440" y1="140" x2="488" y2="140" class="arrow"/>
  <rect x="490" y="85" width="130" height="44" rx="8" class="recv"/>
  <text x="555" y="112" class="label">email</text>
  <rect x="490" y="150" width="130" height="44" rx="8" class="recv"/>
  <text x="555" y="177" class="label">chat, pager…</text>
  <text x="555" y="215" class="sub">receivers</text>
</svg>
