<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The code suggestion lifecycle: inbound and outbound flow</title>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1a4d8f">Inbound flow (your request travels to the model)</text>
  <g fill="#e8f0fb" stroke="#1a4d8f" stroke-width="1.5">
    <rect x="20" y="45" width="180" height="90" rx="8"/>
    <rect x="220" y="45" width="180" height="90" rx="8"/>
    <rect x="420" y="45" width="180" height="90" rx="8"/>
    <rect x="620" y="45" width="180" height="90" rx="8"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="110" y="75" font-weight="bold">1. Secure sending</text>
    <text x="110" y="95">and context gathering</text>
    <text x="110" y="115" font-size="12">(cursor code, open tabs, FIM)</text>
    <text x="310" y="80" font-weight="bold">2. Proxy filter</text>
    <text x="310" y="102" font-size="12">blocks attempts to</text>
    <text x="310" y="118" font-size="12">manipulate the system</text>
    <text x="510" y="80" font-weight="bold">3. Toxicity filtering</text>
    <text x="510" y="102" font-size="12">harmful content and</text>
    <text x="510" y="118" font-size="12">personal data</text>
    <text x="710" y="80" font-weight="bold">4. Code generation</text>
    <text x="710" y="102" font-size="12">by the large</text>
    <text x="710" y="118" font-size="12">language model</text>
  </g>
  <g stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="200" y1="90" x2="218" y2="90"/>
    <line x1="400" y1="90" x2="418" y2="90"/>
    <line x1="600" y1="90" x2="618" y2="90"/>
    <path d="M710,135 L710,190"/>
  </g>
  <text x="20" y="185" font-size="17" font-weight="bold" fill="#8f4a1a">Outbound flow (the answer travels back to you)</text>
  <g fill="#fbefe6" stroke="#8f4a1a" stroke-width="1.5">
    <rect x="560" y="200" width="240" height="100" rx="8"/>
    <rect x="290" y="200" width="240" height="100" rx="8"/>
    <rect x="20" y="200" width="240" height="100" rx="8"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="680" y="232" font-weight="bold">5. Post-processing</text>
    <text x="680" y="252">and response validation</text>
    <text x="680" y="274" font-size="12">toxicity filter, then proxy checks;</text>
    <text x="680" y="290" font-size="12">failures truncated or discarded</text>
    <text x="410" y="232" font-weight="bold">6. Suggestion delivery</text>
    <text x="410" y="252">and feedback loop</text>
    <text x="410" y="274" font-size="12">only answers that pass every</text>
    <text x="410" y="290" font-size="12">filter reach you</text>
    <text x="140" y="240" font-weight="bold">7. Repeat</text>
    <text x="140" y="262">for later requests</text>
  </g>
  <g stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="560" y1="250" x2="532" y2="250"/>
    <line x1="290" y1="250" x2="262" y2="250"/>
    <path d="M20,280 L8,280 L8,110 L18,110" stroke-dasharray="6 4"/>
  </g>
  <text x="20" y="385" font-size="11" fill="#555555">Drawn for this deck from Microsoft Learn, “GitHub Copilot user prompt process flow” (2025 content). Facts only, in our own words.</text>
</svg>
