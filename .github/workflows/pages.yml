name: pages
# Publishes the site to GitHub Pages as a noindex preview:
#   https://<owner>.github.io/<repo>/
# The real address is site.config.json's (conyso.com/primer/). Any other host
# is built as a preview (src/site/config.mjs): every page noindex, no IndexNow
# key, so this copy never competes with the real one in search.
on:
  push:
    branches: [main, claude/deck-engine]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genanki for the .apkg writer
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Build for the Pages host (PDFs use the runner's Chrome)
        run: node build/build.mjs --origin=https://${{ github.repository_owner }}.github.io --base=/${{ github.event.repository.name }}/
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Preflight against the same host
        run: node build/preflight.mjs --origin=https://${{ github.repository_owner }}.github.io --base=/${{ github.event.repository.name }}/
      # Pages must be switched on once by hand: Settings → Pages → Source:
      # GitHub Actions. The workflow token cannot create the Pages site itself
      # ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
