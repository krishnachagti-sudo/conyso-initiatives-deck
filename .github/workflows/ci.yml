name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: source links rot even when nothing is pushed
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genanki for the .apkg writer
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Tests
        run: npm test
      - name: Card checker
        run: npm run check
      - name: Build decks, fixtures and site (PDFs use the runner's Chrome)
        run: node build/build.mjs --fixtures
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Preflight
        run: npm run preflight
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every source link answers
        run: npm run sources
