<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="520" height="560" fill="#ffffff"/>
  <!-- servicing valve -->
  <rect x="150" y="30" width="30" height="26" fill="#9aa5b1" stroke="#1f2933" stroke-width="2"/>
  <line x1="180" y1="43" x2="300" y2="43" stroke="#1f2933"/>
  <text x="305" y="48">Servicing valve</text>
  <!-- outer (upper) cylinder -->
  <rect x="90" y="56" width="150" height="300" fill="#e4e7eb" stroke="#1f2933" stroke-width="3"/>
  <!-- upper chamber: air or nitrogen -->
  <rect x="95" y="61" width="140" height="120" fill="#dbeafe"/>
  <text x="112" y="110" font-size="14">Compressed air</text>
  <text x="118" y="128" font-size="14">or nitrogen</text>
  <!-- orifice plate -->
  <rect x="95" y="181" width="58" height="10" fill="#52606d"/>
  <rect x="177" y="181" width="58" height="10" fill="#52606d"/>
  <line x1="235" y1="186" x2="300" y2="186" stroke="#1f2933"/>
  <text x="305" y="182">Orifice plate</text>
  <text x="305" y="200">(orifice in centre)</text>
  <!-- piston (inner cylinder) -->
  <rect x="105" y="191" width="120" height="300" fill="#f5f7fa" stroke="#1f2933" stroke-width="3"/>
  <!-- hydraulic fluid -->
  <rect x="110" y="196" width="110" height="290" fill="#fde68a"/>
  <rect x="95" y="191" width="10" height="165" fill="#fde68a"/>
  <rect x="225" y="191" width="10" height="165" fill="#fde68a"/>
  <line x1="215" y1="360" x2="300" y2="360" stroke="#1f2933"/>
  <text x="305" y="356">Hydraulic fluid</text>
  <text x="305" y="374">(lower chamber)</text>
  <!-- tapered metering pin -->
  <polygon points="157,486 173,486 168,150 162,150" fill="#7b8794" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="170" y1="260" x2="300" y2="260" stroke="#1f2933"/>
  <text x="305" y="256">Tapered metering pin</text>
  <text x="305" y="274">(fixed to the piston)</text>
  <!-- labels for cylinders -->
  <line x1="240" y1="90" x2="300" y2="90" stroke="#1f2933"/>
  <text x="305" y="86">Upper (outer) cylinder,</text>
  <text x="305" y="104">fixed to the aircraft</text>
  <line x1="225" y1="440" x2="300" y2="440" stroke="#1f2933"/>
  <text x="305" y="436">Lower cylinder (piston),</text>
  <text x="305" y="454">slides in and out</text>
  <!-- torque links -->
  <polyline points="90,330 45,395 105,460" fill="none" stroke="#1f2933" stroke-width="5"/>
  <circle cx="45" cy="395" r="5" fill="#1f2933"/>
  <text x="12" y="545" font-size="14">Torque links</text>
  <line x1="45" y1="530" x2="45" y2="402" stroke="#1f2933"/>
  <!-- axle -->
  <rect x="60" y="491" width="210" height="18" fill="#9aa5b1" stroke="#1f2933" stroke-width="2"/>
  <line x1="270" y1="500" x2="300" y2="500" stroke="#1f2933"/>
  <text x="305" y="505">Wheel axle</text>
</svg>
